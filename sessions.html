<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Sessions • MentEducation</title><link rel="stylesheet" href="public.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="booking-live.js"></script><style>.wrap{max-width:1050px;margin:auto;padding:34px 18px 70px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:#0b1328;color:#fff}.session{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.session.attn{border-color:#ddc6ff;background:#fdfbff}.topline{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.meta{color:var(--muted);font-size:13px;margin-top:5px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eee9ff;color:#5b32d5;font-size:12px;font-weight:800}.badge.good{background:#edf9f0;color:#267a43}.badge.warn{background:#fff3dc;color:#805d14}.sessionActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.sessionActions .btn{min-height:44px;display:flex;align-items:center;justify-content:center}.empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}.mode{font-size:13px;color:var(--muted)}@media(max-width:600px){.head{display:block}.topline{display:block}.badge{margin-top:10px}.sessionActions{display:grid}.sessionActions .btn{width:100%;box-sizing:border-box}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a id="dashLink" href="dashboards.html?role=mentee">Dashboard</a></div></header><main class="wrap"><div class="head"><div><span class="eyebrow">MentEducation Sessions</span><h1 id="pageTitle">My Sessions</h1><p id="intro" class="section-intro">Your mentorship sessions and anything that needs your attention.</p></div><a id="findMentor" class="btn" href="mentor-directory.html">Find a Mentor</a></div><div id="mode" class="mode">Loading your sessions…</div><div class="tabs"><button class="tab active" data-tab="attention">Needs Attention <span id="attentionCount"></span></button><button class="tab" data-tab="upcoming">Upcoming <span id="upcomingCount"></span></button><button class="tab" data-tab="past">Past Sessions <span id="pastCount"></span></button></div><div id="list"></div></main><script>let role=new URLSearchParams(location.search).get('role')==='mentor'?'mentor':'mentee',active='attention',items=[];const list=document.getElementById('list');if(role==='mentor'){pageTitle.textContent='Sessions';intro.textContent='Manage upcoming mentorship sessions, follow-ups, and completed-session activity.';findMentor.style.display='none';dashLink.href='dashboards.html?role=mentor'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function when(b){return `${MEBooking.fmtDate(b.starts_at)} • ${MEBooking.fmtTime(b.starts_at)}`}function actionFor(x){const id=encodeURIComponent(x.id);if(x.bucket==='attention'){if(role==='mentee'&&x.status==='completed')return `<a class="btn" href="post-session-mentee.html?booking=${id}">${x.confirmed?'Leave Review / View Summary':'Confirm Session'}</a>`;if(role==='mentor'&&x.status==='completed')return `<a class="btn" href="post-session-mentor.html?booking=${id}">${x.followup?'View Session Summary':'Add Follow-Up'}</a>`}if(x.status==='completed')return `<a class="btn light" href="post-session-${role}.html?booking=${id}">View Session Summary</a>`;return `<a class="btn" href="session-${role}.html?booking=${id}">${role==='mentee'?'Prepare for Session':'Manage Session'}</a>`}function manageAction(x){const id=encodeURIComponent(x.id);if(['pending','confirmed','cancelled','no_show'].includes(x.status))return `<a class="btn light" href="booking-status.html?booking=${id}&role=${role}">Manage Booking</a>`;return ''}function render(){const filtered=items.filter(x=>x.bucket===active);list.innerHTML=filtered.length?filtered.map(x=>`<article class="session ${x.bucket==='attention'?'attn':''}"><div class="topline"><div><h3 style="margin:0">${esc(x.service_title||'Mentorship Session')}</h3><div class="meta">${esc(x.person||'MentEducation member')} • ${when(x)}</div></div><span class="badge ${x.bucket==='attention'?'warn':x.status==='completed'?'good':''}">${esc(x.label)}</span></div>${x.reason?`<p style="margin-bottom:0"><strong>${esc(x.reason)}</strong></p>`:''}<div class="sessionActions">${actionFor(x)}${manageAction(x)}<a class="btn light" href="messages.html?booking=${encodeURIComponent(x.id)}">Message</a></div></article>`).join(''):`<div class="empty"><strong>Nothing here right now.</strong><p>${active==='attention'?'You’re all caught up.':'Sessions will appear here automatically.'}</p></div>`;attentionCount.textContent=`(${items.filter(x=>x.bucket==='attention').length})`;upcomingCount.textContent=`(${items.filter(x=>x.bucket==='upcoming').length})`;pastCount.textContent=`(${items.filter(x=>x.bucket==='past').length})`}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});async function live(){await MEBooking.init();let session;try{session=await MEBooking.session()}catch(e){}if(!session){throw new Error('preview')}const table=role==='mentor'?'mentor_session_feed':'mentee_session_feed';const {data,error}=await MEBooking.client.from(table).select('*').order('starts_at',{ascending:false});if(error)throw error;for(const b of data||[]){let summary={},workspace={};if(b.status==='completed'){try{summary=await MEBooking.postSessionSummary(b.id)}catch(e){}}else{try{workspace=await MEBooking.loadWorkspace(b.id)}catch(e){}}const future=new Date(b.starts_at)>new Date();let bucket='past',reason='',label=(b.status||'pending').replaceAll('_',' ');if(b.status==='completed'){if(role==='mentee'&&(!summary.mentee_confirmed_at||!summary.review_submitted)){bucket='attention';reason=!summary.mentee_confirmed_at?'Confirm that your session was completed.':'Your review is ready when you are.';label='Action needed'}else if(role==='mentor'&&!summary.mentor_followup){bucket='attention';reason='Add follow-up notes or resources for your mentee.';label='Follow-up needed'}else bucket='past'}else if(['confirmed','pending'].includes(b.status)&&future){bucket='upcoming';label=b.status==='confirmed'?'Confirmed':'Pending'}else if(['confirmed','pending'].includes(b.status)&&!future){bucket='attention';reason='This session needs an attendance or completion update.';label='Action needed'}items.push({...b,bucket,reason,label,confirmed:!!summary.mentee_confirmed_at,followup:summary.mentor_followup,person:role==='mentor'?(b.mentee_name||'Mentee'):(b.mentor_name||'Mentor')})}mode.textContent='Live session history connected to your MentEducation account.';render()}function preview(){const now=Date.now();items=role==='mentee'?[{id:'preview-complete',service_title:'Career Strategy Session',person:'Maya Johnson',starts_at:new Date(now-86400000).toISOString(),status:'completed',bucket:'attention',label:'Action needed',reason:'Confirm that your session was completed.'},{id:'preview-upcoming',service_title:'Business Planning Session',person:'Marcus Lee',starts_at:new Date(now+3*86400000).toISOString(),status:'confirmed',bucket:'upcoming',label:'Confirmed'},{id:'preview-past',service_title:'Data Career Session',person:'Aisha Patel',starts_at:new Date(now-20*86400000).toISOString(),status:'completed',bucket:'past',label:'Completed',confirmed:true}]:[{id:'preview-complete',service_title:'Career Clarity Session',person:'Jordan M.',starts_at:new Date(now-86400000).toISOString(),status:'completed',bucket:'attention',label:'Follow-up needed',reason:'Add follow-up notes or resources for your mentee.'},{id:'preview-upcoming',service_title:'Leadership Strategy',person:'Alex R.',starts_at:new Date(now+2*86400000).toISOString(),status:'confirmed',bucket:'upcoming',label:'Confirmed'},{id:'preview-past',service_title:'Career Roadmap',person:'Taylor B.',starts_at:new Date(now-12*86400000).toISOString(),status:'completed',bucket:'past',label:'Completed',followup:'Saved'}];mode.textContent='Preview mode — sample sessions are shown so you can review the experience.';render()}live().catch(preview);</script></body></html>
