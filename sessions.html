<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Sessions | MentEducation</title><link rel="stylesheet" href="public.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="booking-live.js"></script><style>.wrap{max-width:1120px;margin:auto;padding:38px 20px 76px}.head{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.head h1{font-size:clamp(34px,4vw,48px);letter-spacing:-.04em;margin:7px 0 8px}.headActions{display:flex;gap:9px}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0 15px;padding-bottom:2px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:#0b1328;color:#fff;border-color:#0b1328}.session{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 7px 24px rgba(17,22,42,.03)}.session.attn{border-color:#d8c9ff;background:#fdfcff}.topline{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.session h3{font-size:19px;margin:0}.person{font-weight:800;margin-top:8px}.meta{color:var(--muted);font-size:13px;margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eee9ff;color:#5b32d5;font-size:11px;font-weight:850}.badge.good{background:#edf9f0;color:#267a43}.badge.warn{background:#fff3dc;color:#805d14}.reason{background:#f8f6ff;border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.5;margin:14px 0 0}.sessionActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.sessionActions .btn{min-height:42px;display:flex;align-items:center;justify-content:center}.empty{background:#fff;border:1px dashed #d8d6e3;border-radius:18px;padding:40px 24px;text-align:center;color:var(--muted)}.empty h3{color:#252a39;margin-top:0}.mode{font-size:12px;color:var(--muted);margin-top:6px}.errorBox{background:#fff4f5;border:1px solid #f0cbd1;border-radius:14px;padding:14px;color:#8b3442;margin:14px 0}@media(max-width:700px){.head{display:block}.headActions{margin-top:15px}.overview{grid-template-columns:1fr}.topline{display:block}.badge{margin-top:10px}.sessionActions{display:grid}.sessionActions .btn{width:100%;box-sizing:border-box}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="dashboards.html">Ment<span>Education</span></a></div></header><main class="wrap"><div class="head"><div><span class="eyebrow">Session Workspace</span><h1 id="pageTitle">My Sessions</h1><p id="intro" class="section-intro">Everything related to your mentorship appointments in one place.</p><div id="mode" class="mode">Loading your sessions…</div></div><div class="headActions"><a id="discoverBtn" class="btn" href="mentor-directory.html">Find a Mentor</a></div></div><section class="overview"><div class="metric"><span>Needs attention</span><strong id="metricAttention">—</strong></div><div class="metric"><span>Upcoming sessions</span><strong id="metricUpcoming">—</strong></div><div class="metric"><span>Completed / past</span><strong id="metricPast">—</strong></div></section><div class="tabs"><button class="tab active" data-tab="attention">Needs Attention <span id="attentionCount"></span></button><button class="tab" data-tab="upcoming">Upcoming <span id="upcomingCount"></span></button><button class="tab" data-tab="past">Past Sessions <span id="pastCount"></span></button></div><div id="list"></div></main><script>let role=new URLSearchParams(location.search).get('role')==='mentor'?'mentor':'mentee',active='attention',items=[];const $=id=>document.getElementById(id),list=$('list');if(role==='mentor'){$('pageTitle').textContent='Sessions';$('intro').textContent='Manage upcoming mentorship sessions, follow-ups and completed-session activity.';$('discoverBtn').href='mentor-availability.html';$('discoverBtn').textContent='Manage Availability'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function when(b){return `${MEBooking.fmtDate(b.starts_at)} · ${MEBooking.fmtTime(b.starts_at)}`}function actionFor(x){const id=encodeURIComponent(x.id);if(x.bucket==='attention'){if(role==='mentee'&&x.status==='completed')return `<a class="btn" href="post-session-mentee.html?booking=${id}">${x.confirmed?'Leave Review / View Summary':'Confirm Session'}</a>`;if(role==='mentor'&&x.status==='completed')return `<a class="btn" href="post-session-mentor.html?booking=${id}">${x.followup?'View Session Summary':'Add Follow-Up'}</a>`}if(x.status==='completed')return `<a class="btn light" href="post-session-${role}.html?booking=${id}">View Session Summary</a>`;return `<a class="btn" href="session-${role}.html?booking=${id}">${role==='mentee'?'View Session':'Manage Session'}</a>`}function manageAction(x){const id=encodeURIComponent(x.id);return ['pending','confirmed','cancelled','no_show'].includes(x.status)?`<a class="btn light" href="booking-status.html?booking=${id}&role=${role}">Manage Booking</a>`:''}function counts(){const a=items.filter(x=>x.bucket==='attention').length,u=items.filter(x=>x.bucket==='upcoming').length,p=items.filter(x=>x.bucket==='past').length;$('attentionCount').textContent=`(${a})`;$('upcomingCount').textContent=`(${u})`;$('pastCount').textContent=`(${p})`;$('metricAttention').textContent=a;$('metricUpcoming').textContent=u;$('metricPast').textContent=p}function render(){counts();const filtered=items.filter(x=>x.bucket===active);list.innerHTML=filtered.length?filtered.map(x=>`<article class="session ${x.bucket==='attention'?'attn':''}"><div class="topline"><div><h3>${esc(x.service_title||'Mentorship Session')}</h3><div class="person">${esc(x.person||'MentEducation member')}</div><div class="meta">${when(x)}</div></div><span class="badge ${x.bucket==='attention'?'warn':x.status==='completed'?'good':''}">${esc(x.label)}</span></div>${x.reason?`<div class="reason"><strong>${esc(x.reason)}</strong></div>`:''}<div class="sessionActions">${actionFor(x)}${manageAction(x)}<a class="btn light" href="messages.html?booking=${encodeURIComponent(x.id)}">Message</a></div></article>`).join(''):`<div class="empty"><h3>${active==='attention'?'You’re all caught up.':'No sessions here yet.'}</h3><p>${active==='attention'?'There are no session actions waiting for you.':active==='upcoming'?'Your next confirmed mentorship session will appear here.':'Completed and past sessions will appear here.'}</p>${role==='mentee'&&active==='upcoming'?'<a class="btn" href="mentor-directory.html">Find a Mentor</a>':''}</div>`}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});async function live(){await MEBooking.init();let session;try{session=await MEBooking.session()}catch(e){}if(!session){location.href='login.html?return='+encodeURIComponent(location.pathname+location.search);return}const table=role==='mentor'?'mentor_session_feed':'mentee_session_feed';const {data,error}=await MEBooking.client.from(table).select('*').order('starts_at',{ascending:false});if(error)throw error;for(const b of data||[]){let summary={};if(b.status==='completed'){try{summary=await MEBooking.postSessionSummary(b.id)}catch(e){}}const future=new Date(b.starts_at)>new Date();let bucket='past',reason='',label=(b.status||'pending').replaceAll('_',' ');if(b.status==='completed'){if(role==='mentee'&&(!summary.mentee_confirmed_at||!summary.review_submitted)){bucket='attention';reason=!summary.mentee_confirmed_at?'Confirm that your mentorship session was completed.':'Your review is ready when you are.';label='Action needed'}else if(role==='mentor'&&!summary.mentor_followup){bucket='attention';reason='Add follow-up notes or resources for your mentee.';label='Follow-up needed'}else bucket='past'}else if(['confirmed','pending'].includes(b.status)&&future){bucket='upcoming';label=b.status==='confirmed'?'Confirmed':'Pending'}else if(['confirmed','pending'].includes(b.status)&&!future){bucket='attention';reason='This session needs an attendance or completion update.';label='Action needed'}items.push({...b,bucket,reason,label,confirmed:!!summary.mentee_confirmed_at,followup:summary.mentor_followup,person:role==='mentor'?(b.mentee_name||'Mentee'):(b.mentor_name||'Mentor')})}$('mode').textContent=items.length?'Connected to your MentEducation account.':'No session history yet.';render()}live().catch(e=>{$('mode').innerHTML='<div class="errorBox">We could not load your sessions right now. Please refresh or try again shortly.</div>';$('metricAttention').textContent=$('metricUpcoming').textContent=$('metricPast').textContent='—';list.innerHTML='<div class="empty"><h3>Sessions unavailable</h3><p>Your account data was not replaced with sample information. Try refreshing the page.</p></div>'});</script><script src="mobile-menu.js" defer></script></body></html>
