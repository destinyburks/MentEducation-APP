<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Applications • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="../../public.css"><style>.wrap{max-width:1180px;margin:auto;padding:34px 18px 70px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font:inherit;font-weight:750;cursor:pointer}.filter.active{background:#6d3df5;color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:16px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eee9ff;color:#5a32d5;font-size:12px;font-weight:800}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.box{border:1px solid var(--line);border-radius:12px;padding:12px}.box strong{display:block;margin-bottom:5px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .btn{min-height:42px}.note{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:12px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:720px){.head,.top{display:block}.details{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../../index.html">Ment<span>Education</span></a><a href="../../dashboards.html">Owner Dashboard</a></div></header><main class="wrap"><div class="head"><div><span class="eyebrow">Owner Review</span><h1>Mentor Applications</h1><p class="section-intro">Review every mentor application from the same account record used by the applicant.</p></div></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="submitted">Submitted</button><button class="filter" data-filter="under_review">Under Review</button><button class="filter" data-filter="more_info_requested">More Info</button><button class="filter" data-filter="approved">Approved</button><button class="filter" data-filter="rejected">Rejected</button></div><div id="status" class="muted">Loading applications…</div><div id="list"></div></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY);let rows=[],filter='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const label=s=>String(s||'draft').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function render(){const v=rows.filter(r=>filter==='all'||r.application_stage===filter);$('status').textContent=`${v.length} application${v.length===1?'':'s'} shown.`;$('list').innerHTML=v.length?v.map(r=>`<article class="card"><div class="top"><div><h2 style="margin:0">${esc(r.legal_name||'Unnamed applicant')}</h2><div class="muted">${esc(r.email||'')} ${r.professional_title?'· '+esc(r.professional_title):''}</div></div><span class="badge">${esc(label(r.application_stage))}</span></div><div class="details"><div class="box"><strong>Expertise</strong><div>${esc(r.primary_expertise||'—')}</div><div class="muted">${esc([r.city,r.state_region,r.country].filter(Boolean).join(', ')||'Location not provided')}</div>${r.linkedin_url?`<div style="margin-top:7px"><a href="${esc(r.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a></div>`:''}</div><div class="box"><strong>Credentials & experience</strong><div class="muted">${esc(r.credentials_summary||'Not provided')}</div></div><div class="box"><strong>Mentorship style</strong><div class="muted">${esc(r.mentorship_style||'Not provided')}</div></div><div class="box"><strong>Why they want to mentor</strong><div class="muted">${esc(r.motivation||'Not provided')}</div></div></div><textarea id="note-${r.mentor_id}" class="note" rows="2" placeholder="Optional message to applicant or internal review note"></textarea><div class="actions"><button class="btn light" onclick="decide('${r.mentor_id}','under_review')">Mark Under Review</button><button class="btn light" onclick="decide('${r.mentor_id}','more_info_requested')">Request More Info</button><button class="btn" onclick="decide('${r.mentor_id}','approved')">Approve & Unlock Onboarding</button><button class="btn light" onclick="decide('${r.mentor_id}','rejected')">Reject</button></div><div id="msg-${r.mentor_id}" class="muted" style="margin-top:8px"></div></article>`).join(''):'<div class="empty">No mentor applications match this filter.</div>'}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('../../login.html?return='+encodeURIComponent(location.href));return}const {data:isAdmin}=await sb.rpc('is_platform_admin');if(!isAdmin){$('status').textContent='Owner access is required.';return}const {data,error}=await sb.rpc('owner_list_mentor_applications');if(error){$('status').textContent=error.message;return}rows=data||[];render()}async function decide(id,decision){const msg=$('msg-'+id),note=$('note-'+id)?.value.trim()||null;msg.textContent='Saving decision…';const {data,error}=await sb.rpc('owner_resolve_mentor_application',{p_mentor_id:id,p_decision:decision,p_message:note});if(error){msg.textContent=error.message;return}msg.textContent=decision==='approved'?'Approved. Mentor onboarding is now unlocked.':'Application updated.';await load()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});load();</script></body></html>
