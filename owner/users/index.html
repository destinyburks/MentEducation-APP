<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users • MentEducation Owner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/dashboard.css"><style>.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.tools input{min-width:280px;flex:1}.user{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.user:last-child{border-bottom:0}.name{font-weight:850;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee9ff;color:#5b32d5;font-size:11px;font-weight:800;text-transform:capitalize}.facts{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:var(--muted)}@media(max-width:700px){.user{align-items:flex-start;flex-direction:column}.tools input{min-width:0;width:100%}.actions{width:100%}.actions .btn{flex:1;text-align:center}}</style></head><body><div class="ownerSharedTop mobileTop"><a class="brand" href="/dashboards.html">Ment<span>Education</span></a></div><div class="app"><aside class="side"><div class="brand">Ment<span>Education</span> Owner</div><nav class="nav"><a href="/dashboards.html">Overview</a><a href="/owner/mentor-applications/">Mentor Applications</a><a class="active" href="/owner/users/">Users</a><a href="/owner/payments/">Payments & Credits</a><a href="/settings.html">Policies & Settings</a></nav></aside><main class="main"><h1 id="title">User Lookup</h1><p class="muted">Search any MentEducation account by name or email, then open the complete account history.</p><div class="tools"><input id="search" placeholder="Search name or email" autocomplete="off"><select id="role"><option value="">All users</option><option value="mentee">Mentees</option><option value="mentor">Mentors</option></select><button class="btn" id="find">Search</button></div><section class="card"><div id="status" class="muted">Loading accounts…</div><div id="list"></div></section></main></div><script src="/assets/common.js"></script><script src="/mobile-menu.js"></script><script>let users=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=c=>'$'+((Number(c)||0)/100).toFixed(2);const dt=v=>v?new Date(v).toLocaleDateString():'—';function render(){const rows=users;$('status').textContent=`${rows.length} account${rows.length===1?'':'s'} found.`;$('list').innerHTML=rows.length?rows.map(x=>`<div class="user"><div><div class="name">${esc(x.full_name||'Unnamed user')}</div><div class="meta">${esc(x.email||'No email')} · <span class="pill">${esc(x.role||'mentee')}</span></div><div class="facts"><span>Joined ${esc(dt(x.created_at))}</span><span>${Number(x.booking_count)||0} booking${Number(x.booking_count)===1?'':'s'}</span><span>Credit ${money(x.active_credit_cents)}</span></div></div><div class="actions"><a class="btn" href="/owner/users/profile.html?id=${encodeURIComponent(x.id)}">View Full History</a>${x.role==='mentee'?`<a class="btn light" href="/owner/users/profile.html?id=${encodeURIComponent(x.id)}#credit">Adjust Credit</a>`:''}</div></div>`).join(''):'<div class="empty">No accounts match that search.</div>'}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?return='+encodeURIComponent(location.href));return}const {data:isAdmin}=await sb.rpc('is_platform_admin');if(!isAdmin){$('status').textContent='Owner access is required.';return}const q=$('search').value.trim()||null,r=$('role').value||null;$('status').textContent='Searching…';const {data,error}=await sb.rpc('owner_search_users',{p_query:q,p_role:r});if(error){$('status').textContent=error.message;$('list').innerHTML='';return}users=data||[];render()}$('find').onclick=load;$('search').onkeydown=e=>{if(e.key==='Enter')load()};$('role').onchange=load;$('role').value='';$('title').textContent='User Lookup';load();</script></body></html>
