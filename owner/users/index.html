<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users • MentEducation Owner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/dashboard.css"><style>.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select,.modal input,.modal select,.modal textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.tools input{min-width:260px}.user{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.user:last-child{border-bottom:0}.name{font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee9ff;color:#5b32d5;font-size:11px;font-weight:800;text-transform:capitalize}.modalBack{position:fixed;inset:0;background:rgba(11,19,40,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%)}.modal label{display:grid;gap:6px;margin:12px 0;font-weight:750}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}@media(max-width:700px){.user{align-items:flex-start;flex-direction:column}.tools input{min-width:0;width:100%}}</style></head><body><div class="ownerSharedTop mobileTop"><a class="brand" href="/dashboards.html">Ment<span>Education</span></a></div><div class="app"><aside class="side"><div class="brand">Ment<span>Education</span> Owner</div><nav class="nav"><a href="/dashboards.html">Overview</a><a href="/owner/mentor-applications/">Mentor Applications</a><a class="active" href="/owner/users/">Users</a><a href="/owner/users/?role=mentor">Mentors</a><a href="/sessions.html?role=owner">Sessions</a><a href="/owner/payments/">Payments & Credits</a><a href="/settings.html">Policies & Settings</a></nav></aside><main class="main"><h1 id="title">Users</h1><p class="muted">Manage platform accounts. Mentees are users, not applications.</p><div class="tools"><input id="search" placeholder="Search name or email"><select id="role"><option value="">All users</option><option value="mentee">Mentees</option><option value="mentor">Mentors</option></select></div><section class="card"><div id="status" class="muted">Loading users…</div><div id="list"></div></section></main></div><div id="modalBack" class="modalBack"><div class="modal"><h2>Adjust Credit</h2><div id="who" class="muted"></div><label>Adjustment<select id="type"><option value="add_credit">Add credit</option><option value="remove_credit">Remove credit</option><option value="restore_credit">Restore credit</option><option value="void_credit">Void credit</option></select></label><label>Amount ($)<input id="amount" inputmode="decimal" placeholder="0.00"></label><label>Reason<textarea id="reason" rows="3" placeholder="Reason for this adjustment"></textarea></label><label>Related booking ID (optional)<input id="booking" placeholder="Optional booking UUID"></label><div id="msg" class="muted"></div><div class="actions"><button class="btn light" id="cancel">Cancel</button><button class="btn" id="save">Apply Adjustment</button></div></div></div><script src="/assets/common.js"></script><script src="/mobile-menu.js"></script><script>let users=[],target=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const q=$('search').value.trim().toLowerCase(),r=$('role').value;const rows=users.filter(x=>(!r||x.role===r)&&(!q||`${x.full_name||''} ${x.email||''}`.toLowerCase().includes(q)));$('status').textContent=`${rows.length} account${rows.length===1?'':'s'} shown.`;$('list').innerHTML=rows.length?rows.map(x=>`<div class="user"><div><div class="name">${esc(x.full_name||'Unnamed user')}</div><div class="meta">${esc(x.email||'')} · <span class="pill">${esc(x.role||'mentee')}</span></div></div><div>${x.role==='mentee'?`<button class="btn light" onclick="adjust('${x.id}')">Adjust Credit</button>`:''}</div></div>`).join(''):'<p class="muted">No users match this view.</p>'}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html?return='+encodeURIComponent(location.href));return}const {data:isAdmin}=await sb.rpc('is_platform_admin');if(!isAdmin){$('status').textContent='Owner access is required.';return}const {data,error}=await sb.from('profiles').select('id,full_name,email,role,created_at').order('created_at',{ascending:false});if(error){$('status').textContent=error.message;return}users=data||[];render()}window.adjust=id=>{target=users.find(x=>x.id===id);$('who').textContent=target?`${target.full_name||'User'} · ${target.email||''}`:'';$('amount').value='';$('reason').value='';$('booking').value='';$('msg').textContent='';$('modalBack').style.display='flex'};$('cancel').onclick=()=>{$('modalBack').style.display='none'};$('save').onclick=async()=>{if(!target)return;const cents=Math.round(Number($('amount').value)*100),reason=$('reason').value.trim();if(!cents||cents<=0){$('msg').textContent='Enter a positive dollar amount.';return}if(!reason){$('msg').textContent='A reason is required for the audit trail.';return}$('save').disabled=true;$('msg').textContent='Applying adjustment…';const {error}=await sb.rpc('admin_adjust_mentee_credit',{p_user_id:target.id,p_adjustment_type:$('type').value,p_amount_cents:cents,p_reason:reason,p_related_booking_id:$('booking').value.trim()||null});$('save').disabled=false;if(error){$('msg').textContent=error.message;return}$('msg').textContent='Credit adjustment saved to the audit trail.';setTimeout(()=>{$('modalBack').style.display='none'},700)};$('search').oninput=render;$('role').onchange=render;const initial=new URLSearchParams(location.search).get('role');if(initial==='mentor'){$('role').value='mentor';$('title').textContent='Mentors'}load();</script></body></html>
