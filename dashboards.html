<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dashboard • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><link rel="stylesheet" href="public.css"><style>:root{--navy:#0b1328;--purple:#6d3df5;--paper:#f7f7fb;--line:#e7e7f0;--muted:#71788a}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh;background:var(--paper)}.side{background:var(--navy);color:#fff;padding:24px 18px;display:flex;flex-direction:column}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em;margin-bottom:26px}.brand span{color:#8c62ff}.nav{display:grid;gap:6px}.nav a,.nav button{border:0;background:transparent;color:#cbd2e1;text-align:left;padding:12px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}.nav a:hover,.nav button:hover,.nav a.active{background:#6d3df5;color:#fff}.sideBottom{margin-top:auto;padding-top:22px}.main{padding:34px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.top h1{margin:0;font-size:34px;letter-spacing:-.04em}.top p{color:var(--muted);margin:6px 0 0}.avatar{width:44px;height:44px;border-radius:50%;background:#eee9ff;color:#5e35d5;display:grid;place-items:center;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.metric{padding:18px}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:30px;margin-top:7px}.card{padding:20px;margin-top:18px}.card h2{margin:0 0 12px}.session{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.session:first-of-type{border-top:0}.sessionTitle{font-weight:800}.small{font-size:13px;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eee9ff;color:#5a32d5;font-size:12px;font-weight:800}.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.mobileTop{display:none}@media(max-width:900px){.shell{display:block}.side{display:none}.mobileTop{display:flex;position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;align-items:center;justify-content:space-between;padding:14px 16px}.mobileTop .brand{margin:0;font-size:21px}.mobileTop button{border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:10px;padding:9px 11px}.main{padding:22px 14px 88px}.top h1{font-size:27px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px}.metric b{font-size:26px}.mobileNav{display:grid!important;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:60;padding:7px 4px max(7px,env(safe-area-inset-bottom))}.mobileNav a{font-size:11px;text-align:center;padding:8px 3px;color:#676e7f}.mobileNav a.active{color:var(--purple);font-weight:800}}@media(max-width:520px){.session{align-items:flex-start;flex-direction:column}.session .btn{padding:9px 10px;font-size:12px}}</style></head><body><div class="mobileTop"><a class="brand" href="index.html">Ment<span>Education</span></a><button id="mobileSignOut">Sign Out</button></div><div class="shell"><aside class="side"><a class="brand" href="index.html">Ment<span>Education</span></a><nav class="nav" id="sideNav"></nav><div class="sideBottom"><button id="signOut">Sign Out</button></div></aside><main class="main"><div class="top"><div><h1 id="greeting">Welcome.</h1><p id="subtitle">Loading your MentEducation account…</p></div><div class="avatar" id="avatar">ME</div></div><div id="dashboardBody">Loading your dashboard…</div></main></div><nav class="mobileNav" id="mobileNav" style="display:none"></nav><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY);let user,profile,role='mentee',sessions=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const initials=v=>String(v||'ME').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ME';const fmt=v=>v?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v)):'—';const money=c=>'$'+((Number(c)||0)/100).toFixed(2);const label=v=>String(v||'pending').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function items(){if(role==='mentor')return[['Dashboard','dashboards.html'],['Sessions','sessions.html?role=mentor'],['Availability','mentor-availability.html'],['Messages','messages.html'],['Earnings','earnings/index.html']];if(role==='owner')return[['Dashboard','dashboards.html'],['Alerts','notifications.html?filter=action'],['Sessions','sessions.html?role=owner'],['Messages','messages.html'],['Payments','owner/payments/index.html']];return[['Dashboard','dashboards.html'],['Find Mentors','mentor-directory.html'],['Sessions','sessions.html?role=mentee'],['Messages','messages.html'],['Wallet','wallet/index.html']]}function renderNav(){const a=items();$('sideNav').innerHTML=a.map((x,i)=>`<a class="${i===0?'active':''}" href="${x[1]}">${x[0]}</a>`).join('');$('mobileNav').innerHTML=a.map((x,i)=>`<a class="${i===0?'active':''}" href="${x[1]}">${x[0]}</a>`).join('')}function sessionRows(){if(!sessions.length)return '<div class="empty">No sessions yet. Your bookings will appear here after you schedule one.</div>';return sessions.slice(0,4).map(s=>`<div class="session"><div><div class="sessionTitle">${esc(s.service_title||'Mentorship Session')}</div><div class="small">${role==='mentor'?'with '+esc(s.mentee_name||'Mentee'):role==='owner'?'Platform booking':'with '+esc(s.mentor_name||'Mentor')} · ${esc(fmt(s.starts_at))}</div></div><div><span class="badge">${esc(label(s.status))}</span><a class="btn light" style="margin-left:7px" href="booking-status.html?booking=${encodeURIComponent(s.id)}&role=${role}">Details</a></div></div>`).join('')}function render(){const name=profile?.full_name||user?.user_metadata?.full_name||user?.email?.split('@')[0]||'there';$('greeting').textContent=`Welcome, ${name}!`;$('subtitle').textContent=role==='mentor'?'Manage your mentoring schedule, sessions, messages and earnings.':role==='owner'?'Manage MentEducation operations and platform activity.':'Find mentors, manage your sessions and keep your goals moving.';$('avatar').textContent=initials(name);renderNav();const now=Date.now(),up=sessions.filter(s=>new Date(s.starts_at).getTime()>now&&!['cancelled','completed','closed'].includes(s.status)).length,done=sessions.filter(s=>s.status==='completed').length,total=sessions.length;let metrics;if(role==='mentor'){const booked=sessions.filter(s=>!['cancelled','closed'].includes(s.status)).reduce((a,s)=>a+(Number(s.amount_cents)||0),0);metrics=[['Upcoming Sessions',up],['Completed Sessions',done],['Total Sessions',total],['Booked Value',money(booked)]]}else if(role==='owner'){metrics=[['Recent Sessions',total],['Upcoming',up],['Completed',done],['Action Center','Open']]}else{metrics=[['Upcoming Sessions',up],['Completed Sessions',done],['Total Sessions',total],['Account','Active']]}$('dashboardBody').innerHTML=`<div class="metrics">${metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div><section class="card"><h2>${role==='mentor'?'Upcoming & Recent Sessions':role==='owner'?'Recent Platform Sessions':'My Sessions'}</h2>${sessionRows()}</section>`}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;try{const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data}catch(e){}profile=profile||{full_name:user.user_metadata?.full_name||user.email?.split('@')[0],role:user.user_metadata?.role||'mentee'};role=profile.role||'mentee';try{const {data:isAdmin}=await sb.rpc('is_platform_admin');if(isAdmin)role='owner'}catch(e){}if(!['mentee','mentor','owner'].includes(role))role='mentee';try{if(role==='owner'){const {data,error}=await sb.from('bookings').select('id,starts_at,status,amount_cents').order('starts_at',{ascending:false}).limit(20);if(error)throw error;sessions=data||[]}else{const source=role==='mentor'?'mentor_session_feed':'mentee_session_feed';const {data,error}=await sb.from(source).select('*').order('starts_at',{ascending:false});if(error)throw error;sessions=data||[]}}catch(e){sessions=[]}render()}async function signOut(){await sb.auth.signOut();location.replace('index.html')}$('signOut').onclick=signOut;$('mobileSignOut').onclick=signOut;boot();</script></body></html>
