<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dashboard • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><link rel="stylesheet" href="public.css"><style>:root{--navy:#0b1328;--purple:#6d3df5;--paper:#f7f7fb;--line:#e7e7f0;--muted:#71788a}.appTop{position:sticky;top:0;z-index:80;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}.appTopInner{width:min(1180px,calc(100% - 36px));height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.appTop .brand{font-size:24px!important;font-weight:900!important;margin:0}.topActions{display:flex;align-items:center;gap:10px}.menuButton{border:1px solid rgba(255,255,255,.26);background:transparent;color:#fff;border-radius:12px;padding:10px 14px;font:inherit;font-weight:850;cursor:pointer}.accountMenu{display:none;position:fixed;top:80px;right:max(18px,calc((100vw - 1180px)/2));width:min(320px,calc(100vw - 28px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 22px 60px rgba(10,15,35,.22);z-index:100}.accountMenu.open{display:block}.accountMenu a,.accountMenu button{display:flex;width:100%;box-sizing:border-box;padding:12px 13px;border:0;background:transparent;border-radius:10px;text-decoration:none;color:#202536;font:inherit;font-size:14px;font-weight:800;cursor:pointer;text-align:left}.accountMenu a:hover,.accountMenu button:hover{background:#f3f0ff;color:#6338df}.accountMenu .active{background:#eee9ff;color:#5a32d5}.menuDivider{height:1px;background:var(--line);margin:7px 4px}.menuScrim{display:none;position:fixed;inset:72px 0 0;background:rgba(11,19,40,.18);z-index:90}.menuScrim.open{display:block}.main{width:min(1180px,calc(100% - 36px));margin:auto;padding:34px 0 60px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}.top h1{margin:0;font-size:34px;letter-spacing:-.04em}.top p{color:var(--muted);margin:6px 0 0}.avatar{width:44px;height:44px;border-radius:50%;background:#eee9ff;color:#5e35d5;display:grid;place-items:center;font-weight:900;cursor:pointer;border:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.metric{padding:18px}.metric span{font-size:13px;color:var(--muted)}.metric b{display:block;font-size:30px;margin-top:7px}.card{padding:20px;margin-top:18px}.card h2{margin:0 0 12px}.session{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.session:first-of-type{border-top:0}.sessionTitle{font-weight:800}.small{font-size:13px;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#eee9ff;color:#5a32d5;font-size:12px;font-weight:800}.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}.application{background:#fff;border:1px solid #ded6ff;border-radius:18px;padding:22px}.application h2{margin-top:0}.application .state{display:inline-block;padding:7px 10px;border-radius:999px;background:#eee9ff;color:#5a32d5;font-weight:800;font-size:12px}.clientControl{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:18px}.clientControl h2{font-size:17px;margin:0 0 5px}.clientControl p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.switch{position:relative;width:54px;height:31px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#d7d9e1;border-radius:999px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:23px;height:23px;left:4px;top:4px;background:#fff;border-radius:50%;box-shadow:0 1px 4px #999;transition:.2s}.switch input:checked+.slider{background:#31a05c}.switch input:checked+.slider:before{transform:translateX(23px)}.statusOn{color:#267a43;font-weight:800}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quick a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:16px}.quick a b{display:block}.quick a span{display:block;color:var(--muted);font-size:13px;margin-top:4px}@media(max-width:900px){.appTopInner{width:min(100% - 28px,760px)}.main{width:min(100% - 28px,760px);padding:22px 0 50px}.top h1{font-size:27px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px}.metric b{font-size:26px}.accountMenu{top:78px;right:14px}.menuScrim{inset:72px 0 0}}@media(max-width:520px){.session,.clientControl{align-items:flex-start}.session{flex-direction:column}.clientControl{gap:12px}.quick{grid-template-columns:1fr}.topActions .avatar{display:none}}</style></head><body><header class="appTop"><div class="appTopInner"><a class="brand" id="brandLink" href="dashboards.html">Ment<span>Education</span></a><div class="topActions"><button class="avatar" id="avatar" type="button">ME</button><button class="menuButton" id="menuButton" type="button">Menu ☰</button></div></div></header><div id="menuScrim" class="menuScrim"></div><div id="accountMenu" class="accountMenu" aria-hidden="true"></div><main class="main"><div class="top"><div><h1 id="greeting">Welcome.</h1><p id="subtitle">Loading your MentEducation account…</p></div></div><div id="dashboardBody">Loading your dashboard…</div></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY);let user,profile,role='mentee',sessions=[],mentorLifecycle=null,mentorProfile=null,ownerSummary=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const initials=v=>String(v||'ME').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ME';const fmt=v=>v?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v)):'—';const money=c=>'$'+((Number(c)||0)/100).toFixed(2);const label=v=>String(v||'pending').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function mentorApproved(){return role==='mentor'&&mentorLifecycle?.application?.application_stage==='approved'}function items(){if(role==='mentor'&&!mentorApproved())return[['Dashboard','dashboards.html'],['Application','mentor-application.html'],['Settings','settings.html']];if(role==='mentor')return[['Dashboard','dashboards.html'],['Sessions','sessions.html?role=mentor'],['Availability','mentor-availability.html'],['Messages','messages.html'],['Earnings','earnings/index.html'],['Settings','settings.html']];if(role==='owner')return[['Overview','dashboards.html?role=owner'],['Mentor Applications','owner/mentor-applications/index.html'],['Users','owner/users/index.html'],['Payments & Credits','owner/payments/index.html'],['Reviews','notifications.html?filter=reviews'],['Policies & Settings','settings.html']];return[['Dashboard','dashboards.html'],['Find Mentors','mentor-directory.html'],['My Sessions','sessions.html?role=mentee'],['Messages','messages.html'],['Wallet','wallet/index.html'],['Settings','settings.html']]}function renderNav(){const a=items();$('accountMenu').innerHTML=a.map((x,i)=>`<a class="${i===0?'active':''}" href="${x[1]}">${x[0]}</a>`).join('')+'<div class="menuDivider"></div><button id="menuSignOut">Sign Out</button>';$('menuSignOut').onclick=signOut;$('brandLink').href=role==='owner'?'dashboards.html?role=owner':'dashboards.html'}function setMenu(open){$('accountMenu').classList.toggle('open',open);$('menuScrim').classList.toggle('open',open);$('accountMenu').setAttribute('aria-hidden',String(!open));$('menuButton').textContent=open?'Close ×':'Menu ☰'}$('menuButton').onclick=()=>setMenu(!$('accountMenu').classList.contains('open'));$('menuScrim').onclick=()=>setMenu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});function sessionRows(){if(!sessions.length)return '<div class="empty">No sessions yet. Your bookings will appear here after you schedule one.</div>';return sessions.slice(0,4).map(s=>`<div class="session"><div><div class="sessionTitle">${esc(s.service_title||'Mentorship Session')}</div><div class="small">${role==='mentor'?'with '+esc(s.mentee_name||'Mentee'):'with '+esc(s.mentor_name||'Mentor')} · ${esc(fmt(s.starts_at))}</div></div><div><span class="badge">${esc(label(s.status))}</span><a class="btn light" style="margin-left:7px" href="booking-status.html?booking=${encodeURIComponent(s.id)}&role=${role}">Details</a></div></div>`).join('')}function renderMentorApplicant(){const a=mentorLifecycle?.application||{},stage=a.application_stage||'draft';$('dashboardBody').innerHTML=`<section class="application"><span class="state">${esc(label(stage))}</span><h2>${stage==='submitted'||stage==='under_review'?'Your application is under review':'Complete your mentor application'}</h2><p>Mentor tools unlock after approval.</p><a class="btn" href="mentor-application.html">View Application</a></section>`}function clientControl(){const on=!!mentorProfile?.accepting_clients;return `<section class="clientControl"><div><h2>Accepting new mentees</h2><p id="clientStatus"><span class="${on?'statusOn':''}">${on?'ON':'OFF'}</span> — ${on?'Mentees can book your available times.':'New bookings are paused. Existing sessions are not affected.'}</p></div><label class="switch" aria-label="Accepting new mentees"><input id="acceptingToggle" type="checkbox" ${on?'checked':''}><span class="slider"></span></label></section>`}function renderOwner(){const s=ownerSummary||{};const metrics=[['Total Users',s.total_users??'—'],['Mentees',s.mentees??'—'],['Mentors',s.mentors??'—'],['Applications',s.pending_applications??'—']];$('dashboardBody').innerHTML=`<div class="metrics">${metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div><section class="card"><h2>Owner/Admin Tools</h2><div class="quick"><a href="owner/users/index.html"><b>Find a User</b><span>Search by name or email and view full account history.</span></a><a href="owner/mentor-applications/index.html"><b>Mentor Applications</b><span>Review only accounts that are actually applying as mentors.</span></a><a href="owner/payments/index.html"><b>Payments & Credits</b><span>Review revenue and adjust eligible account credits.</span></a><a href="settings.html"><b>Policies & Settings</b><span>Manage platform-wide settings and controls.</span></a></div></section>`}function render(){const name=profile?.full_name||user?.user_metadata?.full_name||user?.email?.split('@')[0]||'there';$('greeting').textContent=`Welcome, ${name}!`;$('subtitle').textContent=role==='mentor'?(mentorApproved()?'Manage your mentoring schedule, sessions, messages and earnings.':'Track your mentor application and onboarding status.'):role==='owner'?'Manage MentEducation operations and platform activity.':'Find mentors, manage your sessions and keep your goals moving.';$('avatar').textContent=initials(name);renderNav();if(role==='owner'){renderOwner();return}if(role==='mentor'&&!mentorApproved()){renderMentorApplicant();return}const now=Date.now(),up=sessions.filter(s=>new Date(s.starts_at).getTime()>now&&!['cancelled','completed','closed'].includes(s.status)).length,done=sessions.filter(s=>s.status==='completed').length,total=sessions.length;let metrics;if(role==='mentor'){const booked=sessions.filter(s=>!['cancelled','closed'].includes(s.status)).reduce((a,s)=>a+(Number(s.amount_cents)||0),0);metrics=[['Upcoming Sessions',up],['Completed Sessions',done],['Total Sessions',total],['Booked Value',money(booked)]]}else metrics=[['Upcoming Sessions',up],['Completed Sessions',done],['Total Sessions',total],['Account','Active']];$('dashboardBody').innerHTML=`${role==='mentor'?clientControl():''}<div class="metrics">${metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div><section class="card"><h2>${role==='mentor'?'Upcoming & Recent Sessions':'My Sessions'}</h2>${sessionRows()}</section>`;const t=$('acceptingToggle');if(t)t.onchange=async()=>{const wanted=t.checked;t.disabled=true;const {data,error}=await sb.rpc('set_my_accepting_clients',{p_accepting:wanted});if(error){t.checked=!wanted;alert(error.message)}else{mentorProfile.accepting_clients=!!data;const st=$('clientStatus');st.innerHTML=`<span class="${data?'statusOn':''}">${data?'ON':'OFF'}</span> — ${data?'Mentees can book your available times.':'New bookings are paused. Existing sessions are not affected.'}`}t.disabled=false}}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data||{full_name:user.user_metadata?.full_name||user.email?.split('@')[0],role:user.user_metadata?.role||'mentee'};role=profile.role||'mentee';try{const {data:isAdmin}=await sb.rpc('is_platform_admin');if(isAdmin)role='owner'}catch(e){}if(!['mentee','mentor','owner'].includes(role))role='mentee';if(role==='owner'){try{const {data}=await sb.rpc('owner_admin_summary');ownerSummary=data||{}}catch(e){ownerSummary={}}}if(role==='mentor'){try{const [{data:l},{data:m}]=await Promise.all([sb.rpc('get_my_mentor_lifecycle'),sb.from('mentor_profiles').select('accepting_clients,verified,application_status,profile_published_at').eq('user_id',user.id).maybeSingle()]);mentorLifecycle=l;mentorProfile=m||{accepting_clients:false}}catch(e){}}try{if(role==='mentor'&&mentorApproved()){const {data}=await sb.from('mentor_session_feed').select('*').order('starts_at',{ascending:false});sessions=data||[]}else if(role==='mentee'){const {data}=await sb.from('mentee_session_feed').select('*').order('starts_at',{ascending:false});sessions=data||[]}}catch(e){sessions=[]}render()}async function signOut(){await sb.auth.signOut();location.replace('index.html')}$('avatar').onclick=()=>location.href='account-profile.html';boot();</script></body></html>
