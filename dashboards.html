<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Role Dashboards • MentEducation</title><link rel="stylesheet" href="public.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0b1328;color:white;padding:22px}.side .brand{color:white;margin-bottom:22px}.rolepicker{display:grid;gap:8px;margin:18px 0 24px}.rolepicker button,.menu button,.menu a{width:100%;text-align:left;border:0;border-radius:10px;padding:11px 12px;background:transparent;color:#cbd2e1;font:inherit;font-weight:700;cursor:pointer;display:block}.rolepicker button.active,.menu button.active,.menu a:hover{background:#6d3df5;color:white}.main{padding:28px;background:#f7f7fb}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.topActions{display:flex;gap:10px;align-items:center}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.metric b{display:block;font-size:28px;margin-top:7px}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eee9ff;color:#5c33d2;font-size:12px;font-weight:800}.actiongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.action{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer}.action:hover{box-shadow:0 12px 28px rgba(20,22,50,.07)}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font:inherit}.chat{display:grid;grid-template-columns:250px 1fr;gap:14px}.chatlist,.chatbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.chatmsg{background:#f0ecff;padding:10px 12px;border-radius:12px;margin:8px 0;width:max-content;max-width:80%}.ownerwarn{background:#fff7e8;border:1px solid #f1d399;border-radius:12px;padding:12px}.small{font-size:13px;color:var(--muted)}.queue{margin-top:18px}.queueHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.urgent{background:#fffaf0;border:1px solid #efd49d;border-radius:14px;padding:14px;margin-top:10px}.urgent h3{margin:0 0 6px}.urgent p{margin:0 0 8px;color:var(--muted)}.urgentMeta{font-size:12px;color:var(--muted)}@media(max-width:900px){.shell{display:block}.side{position:sticky;top:0;z-index:10}.rolepicker,.menu{display:flex;overflow-x:auto;gap:6px}.rolepicker button,.menu button,.menu a{white-space:nowrap;width:auto}.main{padding:16px}.metricgrid,.actiongrid,.twocol{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.topActions .btn{display:none}}@media(max-width:560px){.metricgrid,.actiongrid,.twocol{grid-template-columns:1fr}.top{align-items:center}}</style></head><body><div class="shell"><aside class="side"><a class="brand" href="progress.html">Ment<span>Education</span></a><div class="rolepicker"><button class="active" data-role="mentee">Mentee</button><button data-role="mentor">Mentor</button><button data-role="owner">Owner</button></div><nav class="menu" id="menu"></nav></aside><main class="main"><div class="top"><div><span class="eyebrow">Clickable role preview</span><h1 id="title">Mentee Dashboard</h1><p class="section-intro" id="subtitle">Explore the mentee experience while deeper backend connections are being completed.</p></div><div class="topActions"><div id="bellMount"></div><a class="btn light" href="progress.html">Back to Progress</a></div></div><div id="content"></div></main></div><script src="/assets/common.js"></script><script>
const roleData={
mentee:{title:'Mentee Dashboard',subtitle:'Find mentors, manage bookings, notifications, messages, favorites, wallet credits and account settings.',items:[['overview','Overview'],['notifications','Notifications'],['sessions','My Sessions'],['messages','Messages'],['favorites','Favorites'],['wallet','Wallet'],['settings','Settings']]},
mentor:{title:'Mentor Dashboard',subtitle:'Manage your services, pricing, availability, notifications, sessions, messages, earnings and profile.',items:[['overview','Overview'],['notifications','Notifications'],['sessions','Sessions'],['services','Services & Pricing'],['availability','Availability'],['messages','Messages'],['earnings','Earnings'],['profile','Profile']]},
owner:{title:'Owner Console',subtitle:'Review action-required alerts, applications, users, sessions, reports, payments, credits and settings.',items:[['overview','Overview'],['action_required','Action Required'],['notifications','Notifications'],['applications','Applications'],['mentors','Mentors'],['mentees','Mentees'],['sessions','Sessions'],['reports','Reports'],['payments','Payments & Credits'],['settings','Settings']]}}
let role='mentee',view='overview';const menu=document.getElementById('menu'),content=document.getElementById('content');let noticeItems=[];
function money2(v){return '$'+Number(v||0).toFixed(2)}
function setRole(r){role=r;view='overview';document.querySelectorAll('.rolepicker button').forEach(b=>b.classList.toggle('active',b.dataset.role===r));render()}
function openView(v){if(v==='wallet'){location.href='wallet/index.html';return}if(v==='earnings'){location.href='earnings/index.html';return}if(v==='payments'){location.href='owner/payments/index.html';return}if(v==='notifications'){location.href='notifications.html';return}if(v==='action_required'){location.href='notifications.html?filter=action';return}view=v;render()}
function renderMenu(){menu.innerHTML=roleData[role].items.map(([id,label])=>`<button class="${view===id?'active':''}" onclick="openView('${id}')">${label}</button>`).join('')}
function overview(){if(role==='mentee')return `<div class="metricgrid"><div class="metric">Upcoming Sessions<b>2</b></div><div class="metric">Saved Mentors<b>4</b></div><div class="metric">Wallet Credit<b>$25.00</b></div><div class="metric">Unread Notifications<b id="dashUnread">0</b></div></div><div class="actiongrid"><div class="action" onclick="location.href='mentor-directory.html'"><h3>Find a Mentor</h3><p>Search specialties and book support.</p></div><div class="action" onclick="openView('sessions')"><h3>My Sessions</h3><p>Upcoming and past mentorship sessions.</p></div><div class="action" onclick="openView('notifications')"><h3>Notifications</h3><p>Booking, Wallet and session updates.</p></div><div class="action" onclick="openView('messages')"><h3>Messages</h3><p>Conversation threads with mentors.</p></div><div class="action" onclick="openView('wallet')"><h3>Wallet</h3><p>Credits and checkout activity.</p></div><div class="action" onclick="openView('settings')"><h3>Settings</h3><p>Profile and account preferences.</p></div></div>`;
if(role==='mentor')return `<div class="metricgrid"><div class="metric">Upcoming Sessions<b>5</b></div><div class="metric">Active Services<b>3</b></div><div class="metric">Pending Earnings<b>$340</b></div><div class="metric">Unread Notifications<b id="dashUnread">0</b></div></div><div class="actiongrid"><div class="action" onclick="openView('services')"><h3>Services & Pricing</h3><p>Create your own sessions and set your own rates.</p></div><div class="action" onclick="openView('availability')"><h3>Availability</h3><p>Choose when mentees can book you.</p></div><div class="action" onclick="openView('sessions')"><h3>Sessions</h3><p>Manage upcoming mentorship bookings.</p></div><div class="action" onclick="openView('notifications')"><h3>Notifications</h3><p>Bookings, compensation and payout alerts.</p></div><div class="action" onclick="openView('earnings')"><h3>Earnings</h3><p>Track payouts and compensation.</p></div><div class="action" onclick="openView('profile')"><h3>Profile</h3><p>Manage your mentor marketplace presence.</p></div></div>`;
return `<div class="metricgrid"><div class="metric">Pending Applications<b>7</b></div><div class="metric">Approved Mentors<b>42</b></div><div class="metric">Action Required<b id="dashActions">0</b></div><div class="metric">Unread Notifications<b id="dashUnread">0</b></div></div><div class="ownerwarn" style="margin-top:16px"><strong>Owner preview:</strong> general figures are preview data; signed-in notification counts and Action Required items load from the live system.</div><section class="card queue"><div class="queueHead"><div><h2 style="margin-bottom:4px">Action Required</h2><p class="small">Urgent platform items that need Owner/Admin attention.</p></div><a class="btn light" href="notifications.html?filter=action">View All</a></div><div id="ownerActionQueue"><p class="small">Loading action-required items…</p></div></section><div class="actiongrid"><div class="action" onclick="openView('applications')"><h3>Applications</h3><p>Review mentor trust and safety submissions.</p></div><div class="action" onclick="openView('mentors')"><h3>Mentors</h3><p>Manage approved mentor accounts.</p></div><div class="action" onclick="openView('mentees')"><h3>Mentees</h3><p>Review user accounts and credits.</p></div><div class="action" onclick="openView('sessions')"><h3>Sessions</h3><p>Inspect booking status and history.</p></div><div class="action" onclick="openView('reports')"><h3>Reports</h3><p>Safety, conduct and payment concerns.</p></div><div class="action" onclick="openView('payments')"><h3>Payments & Credits</h3><p>Connected financial admin screen.</p></div></div>`}
function sessions(){return `<div class="card"><h2>${role==='mentor'?'Mentor Sessions':role==='owner'?'Platform Sessions':'My Sessions'}</h2><div class="row"><div><b>Career Strategy Session</b><div class="small">Aug 27 • 1:00 PM • Video</div></div><div><span class="badge">Confirmed</span></div></div><div class="row"><div><b>Business Planning Session</b><div class="small">Sep 2 • 4:30 PM • Video</div></div><span class="badge">Upcoming</span></div><div class="row"><div><b>Data Career Session</b><div class="small">Aug 12 • Completed</div></div><span class="badge">Completed</span></div></div>`}
function messages(){return `<div class="chat"><div class="chatlist"><h3>Conversations</h3><div class="row"><div><b>Maya Johnson</b><div class="small">Career Session</div></div><span class="badge">1 new</span></div><div class="row"><div><b>Marcus Lee</b><div class="small">Business Session</div></div></div></div><div class="chatbox"><h3>Maya Johnson</h3><div class="chatmsg">Hi! Looking forward to our session.</div><div class="chatmsg" style="margin-left:auto;background:#0b1328;color:white">Thank you! I have a few career questions ready.</div><input class="input" placeholder="Write a message…"><button class="btn" style="margin-top:10px">Send</button></div></div>`}
function favorites(){return `<div class="grid"><div class="card"><h3>Maya Johnson</h3><p>Career Strategy • Leadership</p><a class="btn" href="mentor-profile.html?mentor=maya">View Profile</a></div><div class="card"><h3>Aisha Patel</h3><p>Technology • Data Analytics</p><a class="btn" href="mentor-profile.html?mentor=aisha">View Profile</a></div></div>`}
function settings(){return `<div class="twocol"><div class="card"><h2>Profile Settings</h2><label>Display name<input class="input" value="Preview User"></label><label>Email<input class="input" value="user@example.com"></label><button class="btn">Save Changes</button></div><div class="card"><h2>Security</h2><p>Manage password, sessions and account security.</p><button class="btn light">Change Password</button></div></div>`}
function services(){return `<div class="card"><h2>Your Services & Pricing</h2><p class="section-intro">You control what you offer, how long each session lasts and what you charge. MentEducation does not set your prices.</p><div class="row"><div><b>Career Clarity Session</b><div class="small">45 minutes • Video</div></div><div><b>$65</b> <button class="btn light">Edit</button></div></div><div class="row"><div><b>Deep-Dive Strategy</b><div class="small">60 minutes • Video</div></div><div><b>$90</b> <button class="btn light">Edit</button></div></div></div>`}
function availability(){return `<div class="twocol"><div class="card"><h2>Weekly Availability</h2>${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<div class="row"><span>${d}</span><span><input type="checkbox" checked> 10:00 AM–5:00 PM</span></div>`).join('')}</div><div class="card"><h2>Booking Preferences</h2><p>Minimum notice</p><select class="input"><option>24 hours</option><option>48 hours</option></select></div></div>`}
function profile(){return `<div class="twocol"><div class="card"><h2>Mentor Profile</h2><label>Headline<input class="input" value="Career Strategy • Leadership"></label><label>Bio<textarea class="input" rows="6">I help mentees turn career questions into practical next steps.</textarea></label></div><div class="card"><h2>Marketplace Preview</h2><a class="btn" href="mentor-profile.html?mentor=maya">Open Sample Public Profile</a></div></div>`}
function applications(){return `<div class="card"><h2>Mentor Applications</h2>${['Taylor Reed — Business','Chris Morgan — Technology','Nia Carter — Healthcare'].map(x=>`<div class="row"><div><b>${x}</b><div class="small">Identity • credentials • screening review</div></div><button class="btn light">Review</button></div>`).join('')}</div>`}
function users(type){return `<div class="card"><h2>${type==='mentors'?'Approved Mentors':'Mentee Accounts'}</h2>${['Account 001','Account 002','Account 003'].map((x,i)=>`<div class="row"><div><b>${x}</b><div class="small">Active • joined Aug ${10+i}, 2026</div></div><button class="btn light">View</button></div>`).join('')}</div>`}
function reports(){return `<div class="card"><h2>Reports & Disputes</h2><div class="row"><div><b>Attendance dispute</b><div class="small">Booking #ME-2041 • awaiting review</div></div><span class="badge">Open</span></div><div class="row"><div><b>Conduct report</b><div class="small">Mentor session • Owner review required</div></div><span class="badge">Priority</span></div></div>`}
function renderContent(){let html;if(view==='overview')html=overview();else if(view==='sessions')html=sessions();else if(view==='messages')html=messages();else if(view==='favorites')html=favorites();else if(view==='settings')html=settings();else if(view==='services')html=services();else if(view==='availability')html=availability();else if(view==='profile')html=profile();else if(view==='applications')html=applications();else if(view==='mentors'||view==='mentees')html=users(view);else if(view==='reports')html=reports();else html=overview();content.innerHTML=html;refreshNoticeUI()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loadNotifications(){try{const {data:{session}}=await sb.auth.getSession();if(!session){noticeItems=[{title:'Mentor no-show report needs review',message:'A mentee reported a mentor absent from a confirmed session.',category:'no_show',action_required:true,action_url:'/notifications.html?filter=action',created_at:new Date().toISOString(),read_at:null},{title:'Payout hold needs review',message:'A payout is currently held pending review.',category:'payout',action_required:true,action_url:'/notifications.html?filter=action',created_at:new Date(Date.now()-3600000).toISOString(),read_at:null}];refreshNoticeUI();return}const {data,error}=await sb.rpc('get_my_notifications',{p_limit:75});if(error)return;noticeItems=data.items||[];refreshNoticeUI()}catch(e){}}
function refreshNoticeUI(){const unread=noticeItems.filter(n=>!n.read_at).length,actions=noticeItems.filter(n=>n.action_required&&!n.read_at);const u=document.getElementById('dashUnread'),a=document.getElementById('dashActions');if(u)u.textContent=unread;if(a)a.textContent=actions.length;const q=document.getElementById('ownerActionQueue');if(q){q.innerHTML=actions.length?actions.slice(0,4).map(n=>`<div class="urgent"><span class="badge">${esc((n.category||'review').replaceAll('_',' '))}</span><h3>${esc(n.title)}</h3><p>${esc(n.message)}</p><div class="urgentMeta">${new Date(n.created_at).toLocaleString()}</div><a class="btn light" style="margin-top:9px" href="${esc(n.action_url||'/notifications.html?filter=action')}">Review</a></div>`).join(''):'<div class="ownerwarn"><strong>All caught up.</strong> There are no unread action-required items right now.</div>'}}
function render(){document.getElementById('title').textContent=roleData[role].title;document.getElementById('subtitle').textContent=roleData[role].subtitle;renderMenu();renderContent()}document.querySelectorAll('.rolepicker button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));const params=new URLSearchParams(location.search);if(params.get('role')&&roleData[params.get('role')])role=params.get('role');if(params.get('view'))view=params.get('view');render();mountNotificationBell('#bellMount');loadNotifications();
</script></body></html>
