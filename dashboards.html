rder-radius:50%;box-shadow:0 1px 4px #999;transition:.2s}.switch input:checked+.slider{background:#31a05c}.switch input:checked+.slider:before{transform:translateX(23px)}.statusOn{color:#267a43;font-weight:800}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quick a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:16px}.quick a b{display:block}.quick a span{display:block;color:var(--muted);font-size:13px;margin-top:4px}

" class="accountMenu" aria-hidden="true"></div><main class="main"><div class="top"><div><h1 id="greeting">Welcome.</h1><p id="subtitle">Loading your MentEducation account…</p></div><div class="mentorTopRight" id="mentorTopRight" style="display:none"><a class="bell" href="notifications.html" aria-label="Notifications">♧</a><button class="profileChip" id="mentorProfileChip"><span class="profileDot" id="mentorProfileDot">ME</span><span id="mentorProfileName">Mentor</span>⌄</button></div></div><div id="dashboardBody">Loading your dashboard…</div></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY);let user,profile,role='mentee',sessions=[],mentorLifecycle=null,mentorProfile=null,ownerSummary=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const initials=v=>String(v||'ME').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ME';const fmt=v=>v?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v)):'—';const money=c=>'$'+((Number(c)||0)/100).toFixed(2);const label=v=>String(v||'pending').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function mentorApproved(){return role==='mentor'&&mentorLifecycle?.application?.application_stage==='approved'}function items(){if(role==='mentor'&&!mentorApproved())return[['Dashboard','dashboards.html'],['Application','mentor-application.html'],['Settings','settings.html']];if(role==='mentor')return[['Dashboard','dashboards.html'],['Bookings','mentor-availability.html'],['Sessions','sessions.html?role=mentor'],['Messages','messages.html'],['Earnings','earnings/index.html'],['Reviews','notifications.html?filter=reviews'],['My Profile','account-profile.html'],['Settings','settings.html'],['Help Center','help.html']];if(role==='owner')return[['Overview','dashboards.html?role=owner'],['Mentor Applications','owner/mentor-applications/index.html'],['Users','owner/users/index.html'],['Payments & Credits','owner/payments/index.html'],['Reviews','notifications.html?filter=reviews'],['Policies & Settings','settings.html']];return[['Dashboard','dashboards.html'],['Find Mentors','mentor-directory.html'],['My Sessions','sessions.html?role=mentee'],['Messages','messages.html'],['Wallet','wallet/index.html'],['Settings','settings.html']]}function renderNav(){const a=items();$('accountMenu').innerHTML=a.map((x,i)=>`<a class="${i===0?'active':''}" href="${x[1]}">${x[0]}</a>`).join('')+'<div class="menuDivider"></div><button id="menuSignOut">Sign Out</button>';$('menuSignOut').onclick=signOut;$('brandLink').href=role==='owner'?'dashboards.html?role=owner':'dashboards.html'}function setMenu(open){$('accountMenu').classList.toggle('open',open);$('menuScrim').classList.toggle('open',open);$('accountMenu').setAttribute('aria-hidden',String(!open));$('menuButton').textContent=open?'Close ×':'Menu ☰'}$('menuButton').onclick=()=>setMenu(!$('accountMenu').classList.contains('open'));$('menuScrim').onclick=()=>setMenu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});function sessionRows(){if(!sessions.length)return '<div class="empty">No sessions yet. Your bookings will appear here after you schedule one.</div>';return sessions.slice(0,4).map(s=>`<div class="session"><div><div class="sessionTitle">${esc(s.service_title||'Mentorship Session')}</div><div class="small">${role==='mentor'?'with '+esc(s.mentee_name||'Mentee'):'with '+esc(s.mentor_name||'Mentor')} · ${esc(fmt(s.starts_at))}</div></div><div><span class="badge">${esc(label(s.status))}</span><a class="btn light" style="margin-left:7px" href="booking-status.html?booking=${encodeURIComponent(s.id)}&role=${role}">Details</a></div></div>`).join('')}function renderMentorApplicant(){const a=mentorLifecycle?.application||{},stage=a.application_stage||'draft';$('dashboardBody').innerHTML=`<section class="application"><span class="state">${esc(label(stage))}</span><h2>${stage==='submitted'||stage==='under_review'?'Your application is under review':'Complete your mentor application'}</h2><p>Mentor tools unlock after approval.</p><a class="btn" href="mentor-application.html">View Application</a></section>`}function clientControl(){const on=!!mentorProfile?.accepting_clients;return `<section class="clientControl"><div><h2>Accepting new mentees</h2><p id="clientStatus"><span class="${on?'statusOn':''}">${on?'ON':'OFF'}</span> — ${on?'Mentees can book your available times.':'New bookings are paused. Existing sessions are not affected.'}</p></div><label class="switch" aria-label="Accepting new mentees"><input id="acceptingToggle" type="checkbox" ${on?'checked':''}><span class="slider"></span></label></section>`}function renderOwner(){const s=ownerSummary||{};const metrics=[['Total Users',s.total_users??'—'],['Mentees',s.mentees??'—'],['Mentors',s.mentors??'—'],['Applications',s.pending_applications??'—']];$('dashboardBody').innerHTML=`<div class="metrics">${metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div><section class="card"><h2>Owner/Admin Tools</h2><div class="quick"><a href="owner/users/index.html"><b>Find a User</b><span>Search by name or email and view full account history.</span></a><a href="owner/mentor-applications/index.html"><b>Mentor Applications</b><span>Review only accounts that are actually applying as mentors.</span></a><a href="owner/payments/index.html"><b>Payments & Credits</b><span>Review revenue and adjust eligible account credits.</span></a><a href="settings.html"><b>Policies & Settings</b><span>Manage platform-wide settings and controls.</span></a></div></section>`}function countdownText(v){if(!v)return'';const ms=new Date(v)-new Date();if(ms<=0)return'Started';const mins=Math.round(ms/60000);if(mins<60)return`Starts in ${mins}m`;const h=Math.floor(mins/60),m=mins%60;if(h<24)return`Starts in ${h}h${m?' '+m+'m':''}`;const d=Math.floor(h/24);return`Starts in ${d}d`}function renderMentorDashboard(name){document.body.classList.add('mentorMode');$('mentorTopRight').style.display='flex';$('greeting').textContent='Mentor Dashboard';$('mentorProfileDot').textContent=initials(name);$('mentorProfileName').textContent=name.split(' ')[0]||'Mentor';const upcoming=[...sessions].filter(s=>new Date(s.starts_at)>new Date()&&!['cancelled','completed','closed'].includes(s.status)).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))[0];let html='<div class="mentorDashWrap">';if(upcoming){const id=encodeURIComponent(upcoming.id),person=upcoming.mentee_name||'Mentee';html+=`<div class="mentorSectionLabel">Upcoming Session</div><section class="upcomingCard"><div class="upcomingHead"><div><h2>${esc(upcoming.service_title||'Mentorship Session')}</h2></div><span class="countdown">${esc(countdownText(upcoming.starts_at))}</span></div><div class="personRow"><div class="personAvatar">${esc(initials(person))}</div><div class="personMeta"><b>${esc(person)}</b><span>Mentee</span></div></div><div class="sessionMeta"><span>▣ ${esc(fmt(upcoming.starts_at))}</span><span>⌛ ${esc(upcoming.duration_minutes||60)} min</span><span>${esc(label(upcoming.status))}</span></div><div class="primaryActions"><a class="refBtn" href="messages.html?booking=${id}">▢ Message Mentee</a><a class="refBtn primary" href="session-mentor.html?booking=${id}">▣ Join Session</a></div></section><section class="actionCard"><h2>Session Actions</h2><div class="actionTiles"><a class="actionTile" href="session-mentor.html?booking=${id}#respond"><span class="ico">▣</span>Respond to Reschedule</a><a class="actionTile" href="session-mentor.html?booking=${id}#noShow"><span class="ico">⚑</span>Report Mentee No-show</a><a class="actionTile" href="session-mentor.html?booking=${id}#unable"><span class="ico">▣</span>Request Reschedule</a><a class="actionTile" href="session-mentor.html?booking=${id}#cancelSession"><span class="ico">⊗</span>Cancel Session</a><a class="actionTile primary" href="session-mentor.html?booking=${id}#complete"><span class="ico">✓</span>Mark Session Completed</a><a class="actionTile" href="earnings/index.html"><span class="ico">$</span>View Earnings</a></div></section><div class="policyReminder"><div><b>◷ Policy Reminder</b><p>Join opens 15 minutes before start. No-show reporting opens after the attendance window when the other participant has not joined.</p></div><a href="booking-policy.html">View Full Policy →</a></div>`}else{html+='<div class="mentorSectionLabel">Upcoming Session</div><div class="mentorEmpty"><b>No upcoming sessions.</b><p>Your next confirmed booking will appear here automatically.</p><a class="refBtn" style="max-width:220px;margin:16px auto 0" href="mentor-availability.html">Manage Availability</a></div>'}html+='</div>';$('dashboardBody').innerHTML=html}function render(){const name=profile?.full_name||user?.user_metadata?.full_name||user?.email?.split('@')[0]||'there';$('greeting').textContent=`Welcome, ${name}!`;$('subtitle').textContent=role==='mentor'?(mentorApproved()?'Manage your mentoring schedule, sessions, messages and earnings.':'Track your mentor application and onboarding status.'):role==='owner'?'Manage MentEducation operations and platform activity.':'Find mentors, manage your sessions and keep your goals moving.';$('avatar').textContent=initials(name);renderNav();if(role==='owner'){renderOwner();return}if(role==='mentor'&&!mentorApproved()){renderMentorApplicant();return}if(role==='mentor'){renderMentorDashboard(name);return}const now=Date.now(),up=sessions.filter(s=>new Date(s.starts_at).getTime()>now&&!['cancelled','completed','closed'].includes(s.status)).length,done=sessions.filter(s=>s.status==='completed').length,total=sessions.length;const metrics=[['Upcoming Sessions',up],['Completed Sessions',done],['Total Sessions',total],['Account','Active']];$('dashboardBody').innerHTML=`<div class="metrics">${metrics.map(x=>`<div class="metric"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div><section class="card"><h2>My Sessions</h2>${sessionRows()}</section>`}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data||{full_name:user.user_metadata?.full_name||user.email?.split('@')[0],role:user.user_metadata?.role||'mentee'};role=profile.role||'mentee';try{const {data:isAdmin}=await sb.rpc('is_platform_admin');if(isAdmin)role='owner'}catch(e){}if(!['mentee','mentor','owner'].includes(role))role='mentee';if(role==='owner'){try{const {data}=await sb.rpc('owner_admin_summary');ownerSummary=data||{}}catch(e){ownerSummary={}}}if(role==='mentor'){try{const [{data:l},{data:m}]=await Promise.all([sb.rpc('get_my_mentor_lifecycle'),sb.from('mentor_profiles').select('accepting_clients,verified,application_status,profile_published_at').eq('user_id',user.id).maybeSingle()]);mentorLifecycle=l;mentorProfile=m||{accepting_clients:false}}catch(e){}}try{if(role==='mentor'&&mentorApproved()){const {data}=await sb.from('mentor_session_feed').select('*').order('starts_at',{ascending:false});sessions=data||[]}else if(role==='mentee'){const {data}=await sb.from('mentee_session_feed').select('*').order('starts_at',{ascending:false});sessions=data||[]}}catch(e){sessions=[]}render()}async function signOut(){await sb.auth.signOut();location.replace('index.html')}$('avatar').onclick=()=>location.href='account-profile.html';$('mentorProfileChip').onclick=()=>location.href='account-profile.html';$('mentorSideSignOut').onclick=e=>{e.preventDefault();signOut()};boot();</script></body></html>
