sessions=[],mentorLifecycle=null,ownerSummary={},walletSummary={};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),initials=v=>String(v||'ME').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ME',fmt=v=>v?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v)):'—',money=c=>'$'+((Number(c)||0)/100).toFixed(2),label=v=>String(v||'pending').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function mentorApproved(){return role==='mentor'&&mentorLifecycle?.application?.application_stage==='approved'}function navItems(){if(role==='mentor'&&!mentorApproved())return[['⌂','Dashboard','dashboards.html'],['▣','Application','mentor-application.html'],['⚙','Settings','settings.html']];if(role==='mentor')return[['⌂','Dashboard','dashboards.html'],['▣','Bookings','mentor-availability.html'],['▤','Sessions','sessions.html?role=mentor'],['□','Messages','messages.html'],['◉','Earnings','earnings/index.html'],['☆','Reviews','notifications.html?filter=reviews'],['♙','My Profile','account-profile.html'],['⚙','Settings','settings.html'],['?','Help Center','help.html']];if(role==='owner')return[['⌂','Overview','dashboards.html?role=owner'],['▣','Mentor Applications','owner/mentor-applications/'],['♙','Users','owner/users/'],['$','Payments & Credits','owner/payments/'],['☆','Reviews','notifications.html?filter=reviews'],['⚙','Policies & Settings','settings.html'],['?','Help Center','help.html']];return[['⌂','Dashboard','dashboards.html'],['⌕','Find Mentors','mentor-directory.html'],['▤','My Sessions','sessions.html?role=mentee'],['□','Messages','messages.html'],['◉','Wallet','wallet/'],['♙','My Profile','account-profile.html'],['⚙','Settings','settings.html'],['?','Help Center','help.html']]}function renderNav(){const n=navItems(),html=n.map((x,i)=>`<a class="${i===0?'active':''}" href="${x[2]}"><spa n>Payments & Credits</a><a class="actionTile" href="notifications.html?filter=reviews"><span class="ico">☆</span>Reviews</a><a class="actionTile" href="settings.html"><span class="ico">⚙</span>Policies & Settings</a><a class="actionTile" href="help.html"><span class="ico">?</span>Help Center</a></div></section><div class="policyReminder"><div><b>Admin Workspace</b><p>Administrative tools remain separate from mentor and mentee account experiences.</p></div><a href="owner/users/">Open User Lookup →</a></div></div>`}function renderApplicant(){const a=mentorLifecycle?.application||{},stage=a.application_stage||'draft';$('dashboardBody').innerHTML=`<div class="dashWrap"><section class="application"><span class="state">${esc(label(stage))}</span><h2>${stage==='submitted'||stage==='under_review'?'Your application is under review':'Complete your mentor application'}</h2><p>Mentor tools unlock after approval.</p><a class="refBtn primary" style="max-width:220px;margin-top:14px" href="mentor-application.html">View Application</a></section></div>`}function render(){const name=profile?.full_name||user?.user_metadata?.full_name||user?.email?.split('@')[0]||'Account';$('profileDot').textContent=initials(name);$('profileName').textContent=name.split(' ')[0]||'Account';$('pageTitle').textContent=role==='owner'?'Admin Dashboard':role==='mentor'?'Mentor Dashboard':'Mentee Dashboard';renderNav();if(role==='owner')renderOwner();else if(role==='mentor'&&!mentorApproved())renderApplicant();else if(role==='mentor')renderMentor();else renderMentee()}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data||{full_name:user.user_metadata?.full_name||user.email?.split('@')[0],role:user.user_metadata?.role||'mentee'};role=profile.role||'mentee';try{const {data:isAdmin}=await sb.rpc('is_platform_admin');if(isAdmin)role='owner'}catch(e){}if(!['mentee','mentor','owner'].includes(role))role='mentee';if(role==='owner'){try{const {data}=await sb.rpc('owner_admin_summary');ownerSummary=data||{}}catch(e){}}if(role==='mentor'){try{const {data}=await sb.rpc('get_my_mentor_lifecycle');mentorLifecycle=data}catch(e){}}try{if(role==='mentor'&&mentorApproved()){const {data}=await sb.from('mentor_session_feed').select('*').order('starts_at',{ascending:false});sessions=data||[]}else if(role==='mentee'){const {data}=await sb.from('mentee_session_feed').select('*').order('starts_at',{ascending:false});sessions=data||[];try{const {data:w}=await sb.rpc('get_my_wallet_dashboard');walletSummary=w?.summary||w?.wallet||w||{}}catch(e){}}}catch(e){sessions=[]}render()}async function signOut(){await sb.auth.signOut();location.replace('index.html')}$('profileChip').onclick=()=>location.href='account-profile.html';$('sideSignOut').onclick=e=>{e.preventDefault();signOut()};boot();</script></body></html>
