<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Find Mentors • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/mobile-menu.js" defer></script><link rel="stylesheet" href="public.css"><style>.wrap{max-width:1120px;margin:auto}.directoryHero{padding:56px 0 42px;background:linear-gradient(180deg,#fff 0%,#faf8ff 100%)}.directoryHero h1{max-width:720px;margin:8px 0 12px;font-size:clamp(38px,5vw,62px);line-height:1.02;letter-spacing:-.045em}.directoryIntro{max-width:620px;color:var(--muted);line-height:1.55;font-size:17px;margin:0}.directoryBody{padding-top:30px}.searchbar{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:0 0 18px}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;font:inherit;background:#fff;box-sizing:border-box}.mentorGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.mentor-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.mentorTop{display:flex;gap:13px;align-items:flex-start}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#eee9ff;color:#6538df;font-size:20px;font-weight:900;overflow:hidden;flex:0 0 auto}.avatar img{width:100%;height:100%;object-fit:cover}.mentorName{margin:2px 0 4px;font-size:21px}.verified{color:#267a43;font-size:11px;font-weight:850}.headline{color:var(--muted);font-size:13px;line-height:1.45;margin:12px 0 9px}.profession{display:inline-flex;align-self:flex-start;font-size:12px;padding:7px 10px;border-radius:999px;background:#f0ecff;color:#5932ce;font-weight:800;margin-bottom:10px}.rating{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:13px}.stars{color:#6d3df5;font-weight:900}.newMentor{display:inline-flex;align-items:center;gap:6px;color:#5932ce;font-size:12px;font-weight:850;background:#f7f4ff;border-radius:999px;padding:7px 10px}.facts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0 12px}.bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:13px}.price{font-weight:900;font-size:20px}.price small{font-size:12px;color:var(--muted);font-weight:600}.accept{color:#267a43;font-size:12px;font-weight:800;margin:7px 0 12px}.paused{color:#8a6515}.mentor-card .btn{width:100%;box-sizing:border-box}.empty{display:none;padding:34px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.count{color:var(--muted);margin:2px 0 14px;font-weight:650}.appHeaderAction{display:none}@media(max-width:900px){.mentorGrid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.directoryHero{padding:28px 0 22px}.directoryHero .eyebrow{font-size:13px}.directoryHero h1{font-size:34px;line-height:1.03;margin:7px 0 9px;max-width:330px}.directoryIntro{font-size:15px;line-height:1.4;max-width:350px}.directoryBody{padding-top:18px}.searchbar{grid-template-columns:1fr;gap:10px;margin-bottom:14px}.field{padding:13px 14px;border-radius:14px}.mentorGrid{grid-template-columns:1fr}.mentor-card{padding:18px}.mentorName{font-size:20px}.headline{margin:10px 0 8px}.profession{margin-bottom:9px}.facts{margin:9px 0 11px}.topbar .nav{min-height:68px}.topbar .brand{font-size:22px}.topbar .nav .public-auth{display:none!important}.appHeaderAction{display:inline-flex;margin-left:auto;width:42px;height:42px;border:1px solid rgba(255,255,255,.22);border-radius:13px;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:21px;font-weight:800}.section{padding-bottom:92px}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a class="appHeaderAction" href="index.html" aria-label="Home">⌂</a></div></header><main><section class="directoryHero"><div class="container wrap"><span class="eyebrow">Find a Mentor</span><h1>Find guidance for what’s next.</h1><p class="directoryIntro">Search by name, profession, or the support you need.</p></div></section><section class="section directoryBody"><div class="container wrap"><div class="searchbar"><input id="q" class="field" placeholder="Search mentors or professions…"><select id="sort" class="field"><option value="recommended">Recommended</option><option value="rating">Highest rated</option><option value="reviews">Most reviewed</option><option value="price-low">Lowest starting price</option><option value="experience">Most experience</option></select></div><div id="count" class="count">Loading mentors…</div><div id="mentorGrid" class="mentorGrid"></div><div class="empty" id="empty"><strong>No mentors match your search.</strong><p>Try searching a different name, profession, or keyword.</p></div></div></section></main><script src="/public-menu.js"></script><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),q=document.getElementById('q'),sort=document.getElementById('sort'),grid=document.getElementById('mentorGrid'),empty=document.getElementById('empty'),count=document.getElementById('count');let mentors=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const displayName=v=>String(v||'MentEducation Mentor').replace(/\s*\(Sandbox Mentor\)\s*/gi,'').trim();const initials=v=>displayName(v).split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const stars=r=>{const n=Math.round(Number(r)||0);return '★'.repeat(n)+'☆'.repeat(5-n)};const money=c=>c==null?'Price unavailable':'$'+(Number(c)/100).toFixed(0);function card(m){const name=displayName(m.name),photo=m.profile_photo_url?`<img alt="${esc(name)}" src="${esc(m.profile_photo_url)}">`:esc(initials(name)),rc=Number(m.review_count)||0,rating=Number(m.average_rating)||0,price=m.starting_price_cents,profession=(m.specialties||[])[0]||m.headline||'Professional Mentor',reviewBlock=rc>0?`<div class="rating"><span class="stars">${stars(rating)}</span><strong>${rating.toFixed(1)}</strong><span>${rc} verified review${rc===1?'':'s'}</span></div>`:'<div class="rating"><span class="newMentor">✦ New mentor</span></div>';return `<article class="mentor-card"><div class="mentorTop"><div class="avatar">${photo}</div><div><h3 class="mentorName">${esc(name)}</h3>${m.verified!==false?'<span class="verified">✓ Verified Mentor</span>':''}</div></div><div class="headline">${esc(m.headline||'MentEducation Mentor')}</div><div class="profession">${esc(profession)}</div>${reviewBlock}<div class="facts"><span>${Number(m.years_experience)||0} yrs experience</span><span>${Number(m.completed_sessions)||0} sessions completed</span></div><div class="bottom"><div class="price">${money(price)} ${price!=null?'<small>starting price</small>':''}</div><div class="accept ${m.accepting_clients===false?'paused':''}">${m.accepting_clients===false?'Not accepting new bookings':'✓ Accepting new mentees'}</div><a class="btn" href="mentor-profile.html?mentor=${encodeURIComponent(m.slug)}">View Profile</a></div></article>`}function render(){const term=q.value.trim().toLowerCase();let list=mentors.filter(m=>{const profession=(m.specialties||[])[0]||'';const hay=[displayName(m.name),m.headline,m.bio,profession].join(' ').toLowerCase();return !term||hay.includes(term)});const s=sort.value;if(s==='rating')list.sort((a,b)=>(b.average_rating||0)-(a.average_rating||0));else if(s==='reviews')list.sort((a,b)=>(b.review_count||0)-(a.review_count||0));else if(s==='price-low')list.sort((a,b)=>(a.starting_price_cents??1e12)-(b.starting_price_cents??1e12));else if(s==='experience')list.sort((a,b)=>(b.years_experience||0)-(a.years_experience||0));grid.innerHTML=list.map(card).join('');count.textContent=list.length+' mentor'+(list.length===1?'':'s')+' found';empty.style.display=list.length?'none':'block'}q.oninput=render;sort.onchange=render;(async()=>{try{const {data,error}=await sb.rpc('get_public_mentor_directory');if(error)throw error;mentors=Array.isArray(data)?data:[]}catch(e){mentors=[]}render()})();</script></body></html>
