<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Profile Setup • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="public.css"><style>.wrap{max-width:780px;margin:auto;padding:38px 18px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.grid{display:grid;gap:15px}.field{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:6px}.muted{font-size:13px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a href="mentor-onboarding.html">Onboarding</a></div></header><main class="wrap"><span class="eyebrow">Mentor Onboarding</span><h1>Complete your mentor profile.</h1><p class="section-intro">This information becomes part of your public mentor profile after you publish.</p><section class="card"><div class="grid"><label><strong>Professional headline</strong><input id="headline" class="field" placeholder="e.g. Real Estate Investor & Career Mentor"></label><label><strong>Years of experience</strong><input id="years" class="field" type="number" min="0" max="80"></label><label><strong>Specialties</strong><input id="specialties" class="field" placeholder="Career Strategy, Real Estate, Leadership"><span class="muted">Separate specialties with commas.</span></label><label><strong>About you</strong><textarea id="bio" class="field" rows="6" placeholder="Tell mentees about your background, experience, and how you can help."></textarea></label><label><strong>Profile photo URL</strong><input id="photo" class="field" type="url" placeholder="https://..."></label></div><div class="actions"><button id="save" class="btn">Save Profile</button><a class="btn light" href="mentor-onboarding.html">Back to Onboarding</a></div><div id="msg" class="muted" style="margin-top:10px"></div></section></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);let user;async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;const {data,error}=await sb.from('mentor_profiles').select('*').eq('user_id',user.id).maybeSingle();if(error){$('msg').textContent=error.message;return}if(data){$('headline').value=data.headline||'';$('years').value=data.years_experience??'';$('specialties').value=(data.specialties||[]).join(', ');$('bio').value=data.bio||'';$('photo').value=data.profile_photo_url||''}}$('save').onclick=async()=>{const payload={user_id:user.id,headline:$('headline').value.trim()||null,years_experience:$('years').value?Number($('years').value):null,specialties:$('specialties').value.split(',').map(x=>x.trim()).filter(Boolean),bio:$('bio').value.trim()||null,profile_photo_url:$('photo').value.trim()||null};$('save').disabled=true;$('msg').textContent='Saving profile…';const {error}=await sb.from('mentor_profiles').upsert(payload,{onConflict:'user_id'});$('msg').textContent=error?error.message:'Profile saved. Your onboarding checklist has been updated.';$('save').disabled=false};boot();</script></body></html>
