<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earnings • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/dashboard.css"></head><body><div class="app"><aside class="side"><div class="brand">Ment<span>Education</span></div><nav class="nav"><a href="/">Dashboard</a><a href="/#mentorDash">My Sessions</a><a class="active" href="/earnings/">Earnings</a><a href="/#mentorDash">Messages</a><a href="/#mentorDash">Availability</a><a href="/#mentorDash">Profile</a></nav></aside><main class="main"><h1>Earnings & Payouts</h1><p class="muted">Track session earnings, no-show compensation and Stripe payouts.</p><section class="grid"><div class="card metric">Lifetime Earnings<b id="life">$0.00</b></div><div class="card metric">Pending Payout<b id="pending">$0.00</b></div><div class="card metric">Paid Out<b id="paid">$0.00</b></div><div class="card metric">Next Available<b id="next">—</b></div></section><section class="two"><div class="card"><h2>Stripe Connect</h2><div id="connect"></div></div><div class="card"><h2>Recent Payouts</h2><div id="payouts"></div></div></section></main></div><script src="/assets/common.js"></script><script>(async()=>{try{await requireSession();const {data,error}=await sb.rpc('get_my_mentor_earnings_dashboard');if(error)throw error;const s=data.summary||data.earnings||data;$('life').textContent=money(s.lifetime_earnings_cents);$('pending').textContent=money(s.pending_payout_cents);$('paid').textContent=money(s.paid_out_cents);$('next').textContent=s.next_available_at?new Date(s.next_available_at).toLocaleDateString():'—';const c=data.connect||data.payout_account||{};$('connect').innerHTML=`<div class="row"><span>Onboarding</span><b>${c.onboarding_status||'Not started'}</b></div><div class="row"><span>Payouts enabled</span><b>${c.payouts_enabled?'Yes':'No'}</b></div><div class="row"><span>Details submitted</span><b>${c.details_submitted?'Yes':'No'}</b></div>`;const p=data.recent_payouts||data.payouts||[];$('payouts').innerHTML=p.length?p.map(x=>`<div class="row"><div><b>${String(x.payout_type||'session_earnings').replaceAll('_',' ')}</b><div class="muted">${fmt(x.created_at||x.available_at)}</div></div><div><b>${money(x.amount_cents)}</b><div class="tag">${x.status}</div></div></div>`).join(''):'<p class="muted">No payouts yet.</p>';}catch(e){errorPage('Earnings unavailable',e.message)}})();</script></body></html>
