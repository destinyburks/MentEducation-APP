<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Application • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="public.css"><style>.wrap{max-width:820px;margin:auto;padding:38px 18px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:6px}.status{background:#f8f6ff;border:1px solid #e4ddff;border-radius:14px;padding:14px;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.muted{color:var(--muted);font-size:13px;line-height:1.5}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a href="dashboards.html">Dashboard</a></div></header><main class="wrap"><span class="eyebrow">Become a Mentor</span><h1>Your mentor application</h1><p class="section-intro">Your application is connected to your MentEducation account. Save your progress and return anytime.</p><div id="status" class="status">Loading your application…</div><section id="formCard" class="card"><div class="grid"><label>Legal / full name<input id="legal_name" class="field"></label><label>Professional title<input id="professional_title" class="field" placeholder="e.g. Software Engineer"></label><label>Primary expertise<input id="primary_expertise" class="field" placeholder="Career, Business, Healthcare…"></label><label>City<input id="city" class="field"></label><label>State / region<input id="state_region" class="field"></label><label>Country<input id="country" class="field" value="United States"></label><label class="full">LinkedIn URL<input id="linkedin_url" class="field" type="url"></label><label class="full">Credentials & experience<textarea id="credentials_summary" class="field" rows="4" placeholder="Education, licenses, certifications, professional experience…"></textarea></label><label class="full">How would you describe your mentorship style?<textarea id="mentorship_style" class="field" rows="4"></textarea></label><label class="full">Why do you want to mentor?<textarea id="motivation" class="field" rows="4"></textarea></label><label class="full"><input id="terms" type="checkbox"> I confirm the information provided is accurate and agree to the mentor application requirements.</label></div><div class="actions"><button id="save" class="btn light">Save & Continue Later</button><button id="submit" class="btn">Submit Application</button></div><div id="msg" class="muted" style="margin-top:10px"></div></section></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);let user,app;const fields=['legal_name','professional_title','primary_expertise','city','state_region','country','linkedin_url','credentials_summary','mentorship_style','motivation'];function fill(a){fields.forEach(k=>{if(a?.[k]!=null)$(k).value=a[k]});$('terms').checked=!!a?.terms_accepted_at}function payload(stage){const x={mentor_id:user.id,application_stage:stage,current_step:stage==='submitted'?4:2,updated_at:new Date().toISOString()};fields.forEach(k=>x[k]=$(k).value.trim()||null);if($('terms').checked)x.terms_accepted_at=new Date().toISOString();if(stage==='submitted')x.submitted_at=new Date().toISOString();return x}async function ensureProfile(){const {data:p,error:readError}=await sb.from('profiles').select('id,role').eq('id',user.id).maybeSingle();if(readError)throw readError;if(p)return p;const fullName=user.user_metadata?.full_name||user.email?.split('@')[0]||'Mentor';const {data:created,error:createError}=await sb.from('profiles').upsert({id:user.id,role:'mentor',full_name:fullName,updated_at:new Date().toISOString()},{onConflict:'id'}).select('id,role').single();if(createError)throw createError;return created}async function save(stage){if(stage==='submitted'&&!$('terms').checked){$('msg').textContent='Please confirm the application requirements before submitting.';return}$('msg').textContent=stage==='submitted'?'Submitting application…':'Saving…';const {error}=await sb.from('mentor_applications').upsert(payload(stage),{onConflict:'mentor_id'});if(error){$('msg').textContent=error.message;return}$('msg').textContent=stage==='submitted'?'Application submitted successfully. Your account is now under review.':'Application saved. You can return anytime.';if(stage==='submitted'){setTimeout(()=>location.href='dashboards.html',700)}}$('save').onclick=()=>save('draft');$('submit').onclick=()=>save('submitted');(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?mode=create&role=mentor&return='+encodeURIComponent(location.href));return}user=session.user;try{await ensureProfile()}catch(e){$('status').innerHTML='<strong>We could not finish setting up your mentor profile.</strong><br><span class="muted">'+e.message+'</span>';$('formCard').style.display='none';return}const {data,error}=await sb.rpc('ensure_my_mentor_application');if(error){$('status').innerHTML='<strong>We could not load your application.</strong><br><span class="muted">'+error.message+'</span>';$('formCard').style.display='none';return}app=data;const stage=app.application_stage||'draft';if(stage==='approved'){location.replace('mentor-onboarding.html');return}fill(app);if(!$('legal_name').value)$('legal_name').value=user.user_metadata?.full_name||'';$('status').innerHTML=stage==='submitted'||stage==='under_review'?'<strong>Application under review</strong><br><span class="muted">We received your application. You can return to your dashboard while MentEducation reviews it.</span>':stage==='more_info_requested'?'<strong>More information requested</strong><br><span class="muted">Please update your application and resubmit it for review.</span>':stage==='rejected'?'<strong>Application decision</strong><br><span class="muted">This application was not approved at this time.</span>':'<strong>Application in progress</strong><br><span class="muted">Complete the fields below, save your progress at any time, and submit when you are ready.'+(app.current_step?' Current step: '+app.current_step+'.':'')+'</span>';if(stage==='rejected')$('formCard').style.display='none'})();</script></body></html>
