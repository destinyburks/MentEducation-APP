<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/mobile-menu.js" defer></script><link rel="stylesheet" href="/public.css"><style>.wrap{max-width:900px;margin:auto;padding:34px 18px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}.hero{display:flex;align-items:center;gap:16px}.avatarLg{width:72px;height:72px;border-radius:50%;background:#eee9ff;color:#5e35d5;display:grid;place-items:center;font-size:24px;font-weight:900}.meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:8px}.row{padding:14px 0;border-bottom:1px solid var(--line)}.row span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.row strong{font-size:15px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf8ef;color:#287447;font-size:12px;font-weight:800}.field{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.notice{margin-top:12px;font-size:13px;color:var(--muted)}@media(max-width:600px){.meta{grid-template-columns:1fr}.hero{align-items:flex-start}.wrap{padding-top:24px}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a href="dashboards.html">Dashboard</a></div></header><main class="wrap"><a href="dashboards.html" style="font-weight:750">← Back to dashboard</a><section class="card"><div class="hero"><div id="avatar" class="avatarLg">ME</div><div><span class="eyebrow">My Profile</span><h1 id="nameHeading" style="margin:4px 0 4px">Loading…</h1><div id="statusPill" class="pill">Active</div></div></div><div class="meta"><div class="row"><span>Email</span><strong id="email">—</strong></div><div class="row"><span>Account type</span><strong id="type">—</strong></div><div class="row"><span>Account status</span><strong id="status">Active</strong></div><div class="row"><span>Email status</span><strong id="emailStatus">—</strong></div><div class="row"><span>Member since</span><strong id="created">—</strong></div><div class="row"><span>Last sign-in</span><strong id="lastSignIn">Current session</strong></div></div></section><section class="card"><h2>Profile information</h2><p class="section-intro">Update the name shown across your MentEducation account.</p><label><strong>Full name</strong><input id="fullName" class="field" autocomplete="name"></label><div class="actions"><button id="saveName" class="btn">Save Profile</button><a class="btn light" href="settings.html">Account & Security</a></div><div id="msg" class="notice"></div></section></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);let user,profile,type='mentee';const initials=v=>String(v||'ME').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'ME';const date=v=>v?new Date(v).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'—';async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;const {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p||{};type=profile.role||user.user_metadata?.role||'mentee';try{const {data:isAdmin}=await sb.rpc('is_platform_admin');if(isAdmin)type='owner/admin'}catch(e){}let name=profile.full_name||user.user_metadata?.full_name||user.email?.split('@')[0]||'MentEducation User';$('nameHeading').textContent=name;$('fullName').value=name;$('avatar').textContent=initials(name);$('email').textContent=user.email||'—';$('type').textContent=String(type).replaceAll('_',' ');$('emailStatus').textContent=user.email_confirmed_at?'Confirmed':'Unconfirmed';$('created').textContent=date(user.created_at);$('status').textContent='Active'}$('saveName').onclick=async()=>{const name=$('fullName').value.trim();if(!name){$('msg').textContent='Enter your full name.';return}$('saveName').disabled=true;$('msg').textContent='Saving…';const {error}=await sb.from('profiles').upsert({id:user.id,full_name:name,role:profile.role||user.user_metadata?.role||'mentee',updated_at:new Date().toISOString()},{onConflict:'id'});if(error){$('msg').textContent=error.message}else{await sb.auth.updateUser({data:{full_name:name}});$('nameHeading').textContent=name;$('avatar').textContent=initials(name);$('msg').textContent='Profile updated.'}$('saveName').disabled=false};load();</script></body></html>
