<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><link rel="stylesheet" href="public.css"><style>.auth-wrap{max-width:620px;margin:48px auto;padding:0 18px}.auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f4f2fa;padding:5px;border-radius:13px;margin:20px 0}.tab{border:0;background:transparent;border-radius:10px;padding:11px;font:inherit;font-weight:800;cursor:pointer}.tab.active{background:#fff;box-shadow:0 2px 8px #22194a14;color:#6237df}.field{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:6px}.stack{display:grid;gap:15px}.roleGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role{border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer}.role.active{border:2px solid #7044e8;background:#f8f5ff}.role b{display:block}.role span{font-size:12px;color:var(--muted)}.actions{display:grid;gap:10px;margin-top:18px}.actions .btn{width:100%;box-sizing:border-box}.muted{color:var(--muted);font-size:13px;line-height:1.5}.msg{margin-top:12px;min-height:20px}.success{background:#eef9f1;border:1px solid #cbe9d3;color:#285c36;border-radius:12px;padding:12px;margin:0 0 14px;line-height:1.5}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.hidden{display:none!important}@media(max-width:600px){.auth-wrap{margin:22px auto;padding:0 14px}.auth-card{padding:20px}.roleGrid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a></div></header><main class="auth-wrap"><div class="auth-card"><div id="successNotice" class="success hidden"></div><span class="eyebrow">MentEducation Account</span><h1 id="heading">Welcome back.</h1><p id="intro" class="muted">Sign in and continue exactly where you left off.</p><div id="tabs" class="tabs"><button id="loginTab" class="tab active">Sign In</button><button id="createTab" class="tab">Create Account</button></div><div id="nameWrap" class="hidden"><label><strong>Full name</strong><input id="fullName" class="field" autocomplete="name" placeholder="Your full name"></label></div><div id="roleWrap" class="hidden" style="margin-top:15px"><strong>I’m here to…</strong><div class="roleGrid" style="margin-top:8px"><div class="role active" data-role="mentee"><b>Find a mentor</b><span>Create a mentee account</span></div><div class="role" data-role="mentor"><b>Become a mentor</b><span>Create an account, then complete your application</span></div></div></div><div class="stack" style="margin-top:15px"><label id="emailWrap"><strong>Email</strong><input id="email" class="field" type="email" autocomplete="email" placeholder="you@example.com"></label><label><strong id="passwordLabel">Password</strong><input id="password" class="field" type="password" autocomplete="current-password" placeholder="At least 8 characters"></label></div><div class="actions"><button id="primary" class="btn">Sign In</button><div id="magicWrap"><div class="divider"><span>or</span></div><button id="magic" class="btn light" style="margin-top:10px">Email Me a Sign-In Link</button></div><button id="forgot" class="btn light">Forgot Password?</button></div><div id="msg" class="muted msg"></div></div></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),q=new URLSearchParams(location.search),rawReturn=q.get('return')||'';let mode=q.get('mode')==='create'?'create':q.get('mode')==='recovery'?'recovery':'login',role=['mentee','mentor'].includes(q.get('role'))?q.get('role'):'mentee';const $=id=>document.getElementById(id);function safeReturn(){if(!rawReturn)return null;try{const u=new URL(rawReturn,location.origin);return u.origin===location.origin?u.href:null}catch{return null}}function destination(r){if(safeReturn())return safeReturn();return r==='mentor'?'mentor-application.html':'dashboards.html'}function selectRole(r){role=r;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x.dataset.role===r))}function clearForm(){$('fullName').value='';$('email').value='';$('password').value='';selectRole('mentee')}function setMode(m){mode=m;const create=m==='create',recovery=m==='recovery';$('tabs').classList.toggle('hidden',recovery);$('loginTab').classList.toggle('active',!create&&!recovery);$('createTab').classList.toggle('active',create);$('nameWrap').classList.toggle('hidden',!create);$('roleWrap').classList.toggle('hidden',!create);$('emailWrap').classList.toggle('hidden',recovery);$('heading').textContent=recovery?'Set a new password.':create?'Create your account.':'Welcome back.';$('intro').textContent=recovery?'Choose a new password for your MentEducation account.':create?'Choose how you’ll use MentEducation and create your account.':'Sign in and continue exactly where you left off.';$('primary').textContent=recovery?'Update Password':create?'Create Account':'Sign In';$('forgot').classList.toggle('hidden',create||recovery);$('magicWrap').classList.toggle('hidden',create||recovery);$('passwordLabel').textContent=recovery?'New password':'Password';$('password').autocomplete=(create||recovery)?'new-password':'current-password';$('msg').textContent=''}function showConfirmation(r){clearForm();setMode('login');$('successNotice').classList.remove('hidden');$('successNotice').innerHTML='<strong>Confirmation email sent!</strong><br>Check your inbox and confirm your email address. Once confirmed, return here to sign in'+(r==='mentor'?' and continue your mentor application.':'.');history.replaceState(null,'','login.html?confirmed=sent'+(r==='mentor'?'&role=mentor':''))}$('loginTab').onclick=()=>setMode('login');$('createTab').onclick=()=>{$('successNotice').classList.add('hidden');setMode('create')};document.querySelectorAll('.role').forEach(x=>x.onclick=()=>selectRole(x.dataset.role));async function upsertProfile(user,r){const name=$('fullName').value.trim()||user.user_metadata?.full_name||user.email.split('@')[0];const {error}=await sb.from('profiles').upsert({id:user.id,role:r,full_name:name,updated_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error}async function currentRole(user){const {data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();return data?.role||user.user_metadata?.role||'mentee'}async function go(user){const {data,error}=await sb.rpc('current_account_access');if(error){$('msg').textContent='We signed you in, but could not determine your account access. Please try again.';return}const access=Array.isArray(data)?data[0]:data;if(access?.is_admin||access?.account_type==='owner_admin'){location.href='/dashboards.html?role=owner';return}location.href=destination(await currentRole(user))}async function existing(){const {data:{session}}=await sb.auth.getSession();if(session&&mode==='login')go(session.user)}$('primary').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,name=$('fullName').value.trim();if(mode!=='recovery'&&(!email||!password)){$('msg').textContent='Enter your email and password.';return}if(mode==='recovery'&&!password){$('msg').textContent='Enter your new password.';return}if((mode==='create'||mode==='recovery')&&password.length<8){$('msg').textContent='Use a password with at least 8 characters.';return}if(mode==='create'&&!name){$('msg').textContent='Enter your full name.';return}$('primary').disabled=true;$('msg').textContent=mode==='recovery'?'Updating your password…':mode==='create'?'Creating your account…':'Signing in…';try{if(mode==='recovery'){const {error}=await sb.auth.updateUser({password});if(error)throw error;$('successNotice').classList.remove('hidden');$('successNotice').innerHTML='<strong>Password updated.</strong> Redirecting to your account…';const {data:{user}}=await sb.auth.getUser();setTimeout(()=>go(user),700)}else if(mode==='login'){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await go(data.user)}else{const signupRole=role;const {data,error}=await sb.auth.signUp({email,password,options:{data:{role:signupRole,full_name:name},emailRedirectTo:location.origin+'/login.html?confirmed=1'}});if(error)throw error;if(data.session){await upsertProfile(data.user,signupRole);location.href=destination(signupRole)}else{showConfirmation(signupRole)}}}catch(e){$('msg').textContent=e.message}finally{$('primary').disabled=false}};$('magic').onclick=async()=>{const email=$('email').value.trim();if(!email){$('msg').textContent='Enter your email first, then choose Email Me a Sign-In Link.';return}$('magic').disabled=true;$('msg').textContent='Sending secure sign-in link…';const redirect=safeReturn()||location.origin+'/login.html?magic=1';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect,shouldCreateUser:false}});$('msg').textContent=error?error.message:'Sign-in link sent. Check your email and open the link on this device.';$('magic').disabled=false};$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){$('msg').textContent='Enter your email first, then choose Forgot Password.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html?mode=recovery'});$('msg').textContent=error?error.message:'Password reset email sent. Check your inbox.'};sb.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'){setMode('recovery');return}if(event==='SIGNED_IN'&&session?.user&&mode==='login'){await go(session.user)}});if(q.get('confirmed')==='sent'){$('successNotice').classList.remove('hidden');$('successNotice').innerHTML='<strong>Confirmation email sent!</strong><br>Check your inbox and confirm your email address. Once confirmed, return here to sign in.'}else if(q.get('confirmed')==='1'){$('successNotice').classList.remove('hidden');$('successNotice').innerHTML='<strong>Email confirmed!</strong> You can now sign in to your MentEducation account.'}else if(q.get('magic')==='1'){$('successNotice').classList.remove('hidden');$('successNotice').innerHTML='<strong>Secure sign-in link accepted.</strong> Checking your account access…'}selectRole(role);setMode(mode);existing();</script></body></html>
