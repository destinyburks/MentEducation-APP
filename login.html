<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><link rel="stylesheet" href="public.css"><style>.auth-wrap{max-width:560px;margin:50px auto;padding:0 18px}.auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.field{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;margin-top:6px}.stack{display:grid;gap:15px}.actions{display:grid;gap:10px;margin-top:18px}.actions .btn{width:100%;box-sizing:border-box}.muted{color:var(--muted);font-size:13px;line-height:1.5}.msg{margin-top:12px;min-height:20px}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a href="mentor-directory.html">Find Mentors</a></div></header><main class="auth-wrap"><div class="auth-card"><span class="eyebrow">Secure Account Access</span><h1>Sign in to continue.</h1><p class="muted">A MentEducation account is required before a live mentor time can be reserved.</p><div class="stack"><label><strong>Email</strong><input id="email" class="field" type="email" autocomplete="email" placeholder="you@example.com"></label><label><strong>Password</strong><input id="password" class="field" type="password" autocomplete="current-password" placeholder="••••••••"></label></div><div class="actions"><button id="signIn" class="btn">Sign In</button><button id="signUp" class="btn light">Create Mentee Account</button></div><div id="msg" class="muted msg"></div></div></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),q=new URLSearchParams(location.search),rawReturn=q.get('return')||'mentor-directory.html';function safeReturn(){try{const u=new URL(rawReturn,location.origin);return u.origin===location.origin?u.href:location.origin+'/mentor-directory.html'}catch{return location.origin+'/mentor-directory.html'}}const emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),msg=document.getElementById('msg'),signIn=document.getElementById('signIn'),signUp=document.getElementById('signUp');async function existing(){const {data:{session}}=await sb.auth.getSession();if(session)location.href=safeReturn()}existing();signIn.onclick=async()=>{msg.textContent='Signing in…';signIn.disabled=true;const {error}=await sb.auth.signInWithPassword({email:emailEl.value.trim(),password:passwordEl.value});if(error){msg.textContent=error.message;signIn.disabled=false;return}location.href=safeReturn()};signUp.onclick=async()=>{msg.textContent='Creating your account…';signUp.disabled=true;const {data,error}=await sb.auth.signUp({email:emailEl.value.trim(),password:passwordEl.value,options:{data:{role:'mentee'}}});if(error){msg.textContent=error.message;signUp.disabled=false;return}if(data.session){location.href=safeReturn();return}msg.textContent='Account created. Check your email to confirm your address, then return here to sign in.';signUp.disabled=false};</script></body></html>
