<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Services • MentEducation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="public.css"><style>.wrap{max-width:860px;margin:auto;padding:38px 18px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:6px}.service{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.service:last-child{border-bottom:0}.small{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{font-size:13px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.service{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Ment<span>Education</span></a><a href="mentor-onboarding.html">Onboarding</a></div></header><main class="wrap"><span class="eyebrow">Mentor Onboarding</span><h1>Services & pricing</h1><p class="section-intro">Create the sessions you want to offer. You choose the title, duration and price.</p><section class="card"><h2>Add a service</h2><div class="grid"><label>Service title<input id="title" class="field" placeholder="e.g. Career Strategy Session"></label><label>Duration (minutes)<input id="duration" class="field" type="number" min="15" step="15" value="45"></label><label>Price ($)<input id="price" class="field" type="number" min="0" step="1" value="75"></label><label class="full">Description<textarea id="description" class="field" rows="4" placeholder="What will the mentee get from this session?"></textarea></label></div><button id="add" class="btn" style="margin-top:14px">Add Service</button><div id="msg" class="muted" style="margin-top:10px"></div></section><section class="card"><h2>Your services</h2><div id="list" class="muted">Loading services…</div></section></main><script>const SB_URL='https://zulbqeqmpvivsdwqmyhn.supabase.co',SB_KEY='sb_publishable_UkXuvZaI0lJcZSCFWvgAtw_Mm6d4HVU',sb=window.supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);let user,services=[];const money=c=>'$'+((Number(c)||0)/100).toFixed(2);async function load(){const {data,error}=await sb.from('mentor_services').select('*').eq('mentor_id',user.id).order('created_at',{ascending:false});if(error){$('list').textContent=error.message;return}services=data||[];$('list').innerHTML=services.length?services.map(s=>`<div class="service"><div><strong>${s.title}</strong><div class="small">${s.duration_minutes} minutes · ${money(s.price_cents)} · ${s.active?'Active':'Inactive'}</div>${s.description?`<div class="small">${s.description}</div>`:''}</div><div class="actions"><button class="btn light" onclick="toggleService('${s.id}',${!s.active})">${s.active?'Deactivate':'Activate'}</button><button class="btn light" onclick="deleteService('${s.id}')">Delete</button></div></div>`).join(''):'No services yet. Add your first session offering above.'}window.toggleService=async(id,active)=>{const {error}=await sb.from('mentor_services').update({active}).eq('id',id).eq('mentor_id',user.id);if(error)alert(error.message);await load()};window.deleteService=async id=>{if(!confirm('Delete this service?'))return;const {error}=await sb.from('mentor_services').delete().eq('id',id).eq('mentor_id',user.id);if(error)alert(error.message);await load()};$('add').onclick=async()=>{const title=$('title').value.trim(),duration=Number($('duration').value),price=Number($('price').value);if(!title||!duration||Number.isNaN(price)){$('msg').textContent='Enter a service title, duration and price.';return}$('add').disabled=true;$('msg').textContent='Adding service…';const {error}=await sb.from('mentor_services').insert({mentor_id:user.id,title,description:$('description').value.trim()||null,duration_minutes:duration,price_cents:Math.round(price*100),active:true});$('msg').textContent=error?error.message:'Service added. Your onboarding checklist has been updated.';$('add').disabled=false;if(!error){$('title').value='';$('description').value='';await load()}};(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html?return='+encodeURIComponent(location.href));return}user=session.user;await load()})();</script></body></html>
