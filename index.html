function fieldOf(id) { return FIELDS.find(f => f.id === id); }
function mentorOf(id) { return MENTORS.find(m => m.id === id); }
function initialsOf(name) {
  return name.split(" ").filter(Boolean).map(p => p[0]).join("").slice(0, 2).toUpperCase();
}

// The backend doesn't store an avatar tint — derive a stable one from the
// mentor's id so the same mentor always gets the same color.
function hashHue(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return Math.abs(hash) % 360;
}

// Standard edit-distance calculation — how many single-character edits
// (insert/delete/substitute) turn word `a` into word `b`. Used below so
// close-but-not-exact spellings still match instead of requiring the
// user to type a name or topic exactly right.
function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[a.length][b.length];
}

// Scores how well a mentor matches a search query — searches name,
// tagline, bio, and field name together. Returns a number (higher is a
// better match) or -1 if it's not a close enough match to show at all.
// An exact substring anywhere scores highest; otherwise each word in the
// query is fuzzy-matched word-by-word against the mentor's text, so a
// typo like "electircian" still finds "electrician", and a partial word
// like "estat" still finds "estate" — no need to type a full exact term.
function mentorSearchScore(mentor, fieldLabel, query) {
  const q = query.trim().toLowerCase();
  if (!q) return 0;

  const haystack = `${mentor.name} ${mentor.tagline} ${mentor.bio} ${fieldLabel}`.toLowerCase();
  if (haystack.includes(q)) return 100;

  const words = haystack.split(/[^a-z0-9]+/).filter(Boolean);
  let best = -1;
  for (const w of words) {
    if (w.startsWith(q) || q.startsWith(w)) { best = 90; break; }
    const dist = levenshtein(q, w);
    const closeness = 1 - dist / Math.max(q.length, w.length);
    const score = closeness * 100;
    if (score > best) best = score;
  }
  // Require a reasonably close match — otherwise every mentor would show
  // up for every query, just in a weird order.
  return best >= 55 ? best : -1;
}

function mapBackendMentor(m) {
  const name = `${m.first_name} ${m.last_name}`;
  return {
    id: m.id,
    name,
    field: m.field,
    initials: initialsOf(name),
    tagline: m.tagline || "",
    bio: m.bio || "",
    rating: m.rating != null ? Number(m.rating) : null, // null → show "New" instead of a star rating
    sessions: m.sessions_count || 0,
    hue: hashHue(m.id),
    models: (m.models || []).map(mm => ({
      id: mm.id,
      label: mm.label,
      detail: mm.durationMinutes
        ? `${mm.durationMinutes} min video call`
        : mm.type === "async" ? "Async feedback" : "Group format",
      price: Math.round((mm.priceCents || 0) / 100),
    })),
  };
}

// Point this at your running backend. Defaults to a local dev server —
// change it once you deploy the backend somewhere reachable.
const API_BASE_URL = "https://menteducation-backened-production.up.railway.app";

async function apiRequest(path, { method = "GET", body, token } = {}) {
  let res;
  try {
    res = await fetch(`${API_BASE_URL}${path}`, {
      method,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    // Most likely cause: the backend isn't running, or isn't reachable
    // from this browser (wrong URL, CORS, etc).
    throw new Error("Couldn't reach the server. Is your backend running?");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error ? data.error.replace(/_/g, " ") : `Request failed (${res.status})`);
  }
  return data;
}

function MentorshipApp() {
  const [screen, setScreen] = useState("login");

  const [query, setQuery] = useState("");
  const [searchFocused, setSearchFocused] = useState(false);
  const [selectedMentorId, setSelectedMentorId] = useState(null);
  const [selectedModelId, setSelectedModelId] = useState(null);
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [bookings, setBookings] = useState([]);
  const [activeConvoId, setActiveConvoId] = useState(null);
  const [convos, setConvos] = useState(CONVERSATIONS);
  const [draft, setDraft] = useState("");
  const [applications, setApplications] = useState(APPLICATIONS_SEED);
  const [applyForm, setApplyForm] = useState({ name: "", field: "", yearsExperience: "", resumeFileName: "", zoomConnected: false, consent: false });
  const [activeApplicationId, setActiveApplicationId] = useState(null);
  const [applyError, setApplyError] = useState(null);

  // Starts as the local demo roster so the app still looks complete if
  // the backend isn't reachable yet — loadMentors() below replaces it
  // with real data the moment it can.
  const [mentors, setMentors] = useState(MENTORS);
  const [mentorsSource, setMentorsSource] = useState("demo"); // "demo" | "live"

  // --- a mentor managing their own bookable offerings ---
  const [myModels, setMyModels] = useState([]);
  const [myModelsLoading, setMyModelsLoading] = useState(false);
  const [myModelsError, setMyModelsError] = useState(null);
  const [newModelForm, setNewModelForm] = useState({ type: "1on1", label: "", priceDollars: "", durationMinutes: "45" });

  // --- mentor subscription billing (flat fee vs. per-session commission) ---
  const [billing, setBilling] = useState(null);
  const [billingLoading, setBillingLoading] = useState(false);
  const [billingError, setBillingError] = useState(null);

  // --- real auth state (kept in memory only, per artifact rules — no
  // localStorage. A page refresh means logging in again, same as any
  // app would ask you to reconnect after clearing all its state.) ---
  const [authToken, setAuthToken] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [authForm, setAuthForm] = useState({ email: "", password: "", firstName: "", lastName: "", role: "client" });
  const [authError, setAuthError] = useState(null);
  const [authLoading, setAuthLoading] = useState(false);

  function go(next) {
    setHistory(h => [...h, screen]);
    setScreen(next);
  }
  function back() {
    setHistory(h => {
      const copy = [...h];
      const prev = copy.pop();
      setScreen(prev || "browse");
      return copy;
    });
  }

  // Shadows the module-level mentorOf() (which only knows the static
  // demo roster) with one backed by whatever's actually in state — real
  // data once loadMentors() succeeds, demo data until then. Falls back
  // to the demo roster too, since the seeded demo conversations/bookings
  // reference demo mentor ids that won't exist in a real (possibly
  // empty) database — without this fallback, Messages/Sessions crash
  // the moment live data replaces the demo mentors.
  function mentorOf(id) {
    return mentors.find(m => m.id === id) || MENTORS.find(m => m.id === id);
  }

  async function loadMentors() {
    try {
      const data = await apiRequest("/api/mentors");
      if (Array.isArray(data.mentors)) {
        setMentors(data.mentors.map(mapBackendMentor));
        setMentorsSource("live");
      }
    } catch (err) {
      // Backend not reachable yet — keep showing demo data rather than
      // an empty screen. Browse shows a small indicator either way.
      console.warn("Couldn't load real mentors, showing demo data:", err.message);
    }
  }

  async function loadMyModels() {
    setMyModelsLoading(true);
    setMyModelsError(null);
    try {
      const data = await apiRequest("/api/mentors/me/models", { token: authToken });
      setMyModels(data.models || []);
    } catch (err) {
      setMyModelsError(err.message);
    } finally {
      setMyModelsLoading(false);
    }
  }

  async function createMyModel() {
    setMyModelsError(null);
    try {
      await apiRequest("/api/mentors/me/models", {
        method: "POST",
        token: authToken,
        body: {
          type: newModelForm.type,
          label: newModelForm.label,
          priceCents: Math.round(Number(newModelForm.priceDollars) * 100),
          durationMinutes: newModelForm.type === "1on1" ? newModelForm.durationMinutes : null,
        },
      });
      setNewModelForm({ type: "1on1", label: "", priceDollars: "", durationMinutes: "45" });
      await loadMyModels();
      loadMentors(); // refresh Browse too, since this mentor's card just changed
    } catch (err) {
      setMyModelsError(err.message);
    }
  }

    setMyModelsError(null);
    try {

                        <button onClick={cancelSubscription} style={{
                          background: "none", border: "1px solid var(--hairline)", borderRadius: 8, padding: "8px 12px",
                          fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "var(--danger)", cursor: "pointer",
                        }}>
                          Cancel and return to commission
                        </button>
                      ) : (
                        <button onClick={startSubscriptionCheckout} style={{
                          background: "var(--gold)", border: "none", borderRadius: 8, padding: "8px 12px",
                          fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 600, fontSize: 12.5, color: "var(--paper)", cursor: "pointer",
                        }}>
                          Switch to flat-fee plan
                        </button>
                      )}
                    </>
                  )}
                  {billingError && (
                    <div style={{
                      display: "flex", gap: 8, alignItems: "flex-start", marginTop: 10, padding: "8px 10px",
                      background: "#F7E9E5", border: "1px solid var(--danger)", borderRadius: 8,
                      fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 11.5, color: "var(--danger)",
                    }}>
                      <AlertCircle size={13} style={{ marginTop: 1, flexShrink: 0 }} />
                      {billingError}
                    </div>
                  )}
                </div>

                <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "#5F6472", lineHeight: 1.55, marginBottom: 16 }}>
                  These are the formats clients can book with you — shown on your profile with the price and duration you set.
                </div>

                {myModelsLoading && (
                  <div style={{ display: "flex", justifyContent: "center", padding: 20 }}>
                    <Loader2 size={20} className="spin" color="var(--gold)" />
                  </div>
                )}

                {myModelsError && (
                  <div style={{
                    display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 14, padding: "10px 12px",
                    background: "#F7E9E5", border: "1px solid var(--danger)", borderRadius: 8,
                    fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "var(--danger)",
                  }}>
                    <AlertCircle size={14} style={{ marginTop: 1, flexShrink: 0 }} />
                    {myModelsError}
                  </div>
                )}

                {!myModelsLoading && myModels.length === 0 && !myModelsError && (
                  <div style={{
                    fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "#8A8768",
                    padding: "16px 0", textAlign: "center",
                  }}>
                    No offerings yet — add your first one below.
                  </div>
                )}

                {myModels.map(m => (
                  <div key={m.id} className="model-option" style={{ cursor: "default" }}>
                    <div>
                      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 600, fontSize: 13.5, color: "var(--ink)" }}>{m.label}</div>
                      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#6B6950" }}>
                        {m.type === "1on1" ? `${m.duration_minutes} min video call` : m.type === "cohort" ? "Group format" : "Async feedback"}
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: "var(--ink)" }}>${(m.price_cents / 100).toFixed(0)}</div>
                      <button onClick={() => deleteMyModel(m.id)} style={{
                        background: "none", border: "none", cursor: "pointer", color: "var(--danger)", display: "flex",
                      }}>
                        <XCircle size={17} />
                      </button>
                    </div>
                  </div>
                ))}

                <div style={{ borderTop: "1px solid var(--hairline)", marginTop: 16, paddingTop: 16 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 10 }}>
                    Add a new offering
                  </div>
                  <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                    {[["1on1", "1:1 Session"], ["cohort", "Cohort"], ["async", "Async"]].map(([id, label]) => (
                      <button key={id} className={`field-chip ${newModelForm.type === id ? "active" : ""}`}
                        onClick={() => setNewModelForm(f => ({ ...f, type: id }))}>{label}</button>
                    ))}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    <input type="text" placeholder="Label (e.g. Career Strategy Session)" value={newModelForm.label}
                      onChange={e => setNewModelForm(f => ({ ...f, label: e.target.value }))} />
                    <div style={{ display: "flex", gap: 10 }}>
                      <input type="text" placeholder="Price in USD (e.g. 85)" value={newModelForm.priceDollars}
                        onChange={e => setNewModelForm(f => ({ ...f, priceDollars: e.target.value }))} />
                      {newModelForm.type === "1on1" && (
                        <input type="text" placeholder="Minutes" value={newModelForm.durationMinutes}
                          onChange={e => setNewModelForm(f => ({ ...f, durationMinutes: e.target.value }))} />
                      )}
                    </div>
                  </div>
                  <button className="primary-btn" style={{ marginTop: 12 }}
                    disabled={!newModelForm.label || !newModelForm.priceDollars}
                    onClick={createMyModel}>
                    Add offering <ArrowRight size={15} />
                  </button>
                </div>
              </div>
            </>
          )}

          {screen === "apply" && (
            <>
              <TopBar title="Apply as a mentor" onBack={back} />
              <div style={{ padding: 18 }}>
                <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "#5F6472", lineHeight: 1.55, marginBottom: 18 }}>
                  Every mentor goes through resume review and a criminal background check before their profile goes live. Plan on a few business days.
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 6 }}>Full name</div>
                    <input type="text" placeholder="Jane Cooper" value={applyForm.name}
                      onChange={e => setApplyForm(f => ({ ...f, name: e.target.value }))} />
                  </div>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 6 }}>Field of expertise</div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      {FIELDS.map(f => (
                        <button key={f.id} className={`field-chip ${applyForm.field === f.id ? "active" : ""}`}
                          onClick={() => setApplyForm(v => ({ ...v, field: f.id }))}>{f.name}</button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 6 }}>Years of experience</div>
                    <input type="text" placeholder="e.g. 8" value={applyForm.yearsExperience}
                      onChange={e => setApplyForm(f => ({ ...f, yearsExperience: e.target.value }))} />
                  </div>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 6 }}>Resume</div>
                    <label style={{
                      display: "flex", alignItems: "center", gap: 8, border: "1px dashed var(--hairline)",
                      borderRadius: 8, padding: "12px", cursor: "pointer", fontFamily: "'IBM Plex Sans', sans-serif",
                      fontSize: 12.5, color: applyForm.resumeFileName ? "var(--ink)" : "#7B8090",
                    }}>
                      <UploadCloud size={16} color="var(--gold)" />
                      {applyForm.resumeFileName || "Upload resume (PDF)"}
                      <input type="file" accept=".pdf,.doc,.docx" style={{ display: "none" }}
                        onChange={e => setApplyForm(f => ({ ...f, resumeFileName: e.target.files[0]?.name || "" }))} />
                    </label>
                  </div>
                  <div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 6 }}>Video sessions</div>
                    {applyForm.zoomConnected ? (
                      <div style={{
                        display: "flex", alignItems: "center", gap: 8, border: "1px solid var(--gold)",
                        borderRadius: 8, padding: "12px", background: "#F1E9D6",
                        fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "var(--ink)",
                      }}>
                        <ShieldCheck size={16} color="var(--gold)" />
                        Zoom account connected
                        <button onClick={() => setApplyForm(f => ({ ...f, zoomConnected: false }))} style={{
                          marginLeft: "auto", background: "none", border: "none", color: "#5F6472",
                          fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 11.5, cursor: "pointer", textDecoration: "underline",
                        }}>Disconnect</button>
                      </div>
                    ) : (
                      <button onClick={() => setApplyForm(f => ({ ...f, zoomConnected: true }))} style={{
                        display: "flex", alignItems: "center", gap: 8, border: "1px dashed var(--hairline)",
                        borderRadius: 8, padding: "12px", background: "var(--paper)", width: "100%",
                        fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "#7B8090", cursor: "pointer",
                      }}>
                        <Calendar size={16} color="var(--gold)" />
                        Connect your Zoom account
                      </button>
                    )}
                    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 11, color: "#7B8090", marginTop: 6, lineHeight: 1.5 }}>
                      You'll host live 1:1 sessions from your own Zoom account. We'll generate meeting links automatically at booking time.
                    </div>
                  </div>
                  <label style={{ display: "flex", gap: 8, alignItems: "flex-start", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#232B3D", marginTop: 4 }}>
                    <input type="checkbox" checked={applyForm.consent}
                      onChange={e => setApplyForm(f => ({ ...f, consent: e.target.checked }))}
                      style={{ marginTop: 2, width: 14, height: 14, flexShrink: 0 }} />
                    I consent to a criminal background check as part of the mentor screening process.
                  </label>
                </div>

                <button className="primary-btn" style={{ marginTop: 20 }}
                  disabled={!applyForm.name || !applyForm.field || !applyForm.yearsExperience || !applyForm.resumeFileName || !applyForm.zoomConnected || !applyForm.consent}
                  onClick={submitApplication}>
                  Submit application <ArrowRight size={15} />
                </button>
              </div>
            </>
          )}

          {screen === "apply-success" && (
            <>
              <TopBar title="Application submitted" onBack={() => { setHistory([]); setScreen("account"); }} />
              <div style={{ padding: 18, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
                <CheckCircle2 size={38} color="var(--gold)" style={{ marginTop: 20 }} />
                <div style={{ fontFamily: "'Newsreader', serif", fontWeight: 600, fontSize: 19, color: "var(--ink)", marginTop: 10 }}>
                  Application received
                </div>
                <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "#5F6472", marginTop: 6, lineHeight: 1.6, maxWidth: 280 }}>
                  We're verifying your experience and running a background check. You'll hear back once your profile is approved and live.
                </div>
                {applyError && (
                  <div style={{
                    display: "flex", gap: 8, alignItems: "flex-start", marginTop: 16, padding: "10px 12px",
                    background: "#F7E9E5", border: "1px solid var(--danger)", borderRadius: 8, textAlign: "left",
                    fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "var(--danger)", maxWidth: 280,
                  }}>
                    <AlertCircle size={14} style={{ marginTop: 1, flexShrink: 0 }} />
                    Saved to this demo only — the real submission didn't reach your backend: {applyError}
                  </div>
                )}
              </div>
            </>
          )}

          {screen === "admin" && (
            <>
              <TopBar title="Applications" onBack={back} />
              <div style={{ padding: "6px 0" }}>
                {applications.map(a => (
                  <div key={a.id} className="mentor-card" onClick={() => { setActiveApplicationId(a.id); go("admin-detail"); }}>
                    <div style={{
                      width: 44, height: 44, borderRadius: 8, background: "var(--paper-outer)",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontFamily: "'Newsreader', serif", fontWeight: 600, fontSize: 15, color: "var(--ink)", flexShrink: 0,
                    }}>{initialsOf(a.name)}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between" }}>
                        <div style={{ fontFamily: "'Newsreader', serif", fontWeight: 600, fontSize: 15, color: "var(--ink)" }}>{a.name}</div>
                        <span style={{
                          fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, textTransform: "uppercase",
                          color: a.status === "pending" ? "var(--gold)" : a.status === "approved" ? "var(--gold)" : "var(--danger)",
                        }}>{a.status}</span>
                      </div>
                      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#5F6472", margin: "2px 0 6px" }}>
                        {fieldOf(a.field)?.name || "—"} · {a.yearsExperience} yrs · applied {a.appliedDate}
                      </div>
                      <BgCheckBadge status={a.bgCheck} />
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {screen === "admin-detail" && activeApplication && (
            <>
              <TopBar title="Application" onBack={back} />
              <div style={{ padding: 18 }}>
                <div style={{ fontFamily: "'Newsreader', serif", fontWeight: 600, fontSize: 20, color: "var(--ink)" }}>{activeApplication.name}</div>
                <div style={{ margin: "6px 0 16px" }}><FieldBadge fieldId={activeApplication.field} /></div>

                <div style={{
                  display: "flex", alignItems: "center", gap: 8, border: "1px solid var(--hairline)",
                  borderRadius: 8, padding: 12, marginBottom: 14, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: "var(--ink)",
                }}>
                  <FileText size={16} color="var(--gold)" />
                  {activeApplication.resumeFileName}
                  <span style={{ marginLeft: "auto", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5F6472" }}>{activeApplication.yearsExperience} yrs exp.</span>
                </div>

                <label style={{ display: "flex", gap: 8, alignItems: "center", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5, color: "var(--ink)", marginBottom: 16 }}>
                  <input type="checkbox" checked={activeApplication.resumeVerified}
                    onChange={() => toggleResumeVerified(activeApplication.id)}
                    style={{ width: 14, height: 14 }} />
                  Resume and experience verified
                </label>

                <div style={{
                  display: "flex", alignItems: "center", gap: 8, fontFamily: "'IBM Plex Sans', sans-serif",
                  fontSize: 12.5, color: activeApplication.zoomConnected ? "var(--gold)" : "var(--danger)", marginBottom: 16,
                }}>
                  {activeApplication.zoomConnected
                    ? <><ShieldCheck size={15} /> Zoom account connected</>
                    : <><ShieldAlert size={15} /> Zoom not yet connected</>}
                </div>

                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--gold)", marginBottom: 8 }}>
                  Background check
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
                  <BgCheckBadge status={activeApplication.bgCheck} />
                  {activeApplication.bgCheck === "pending" && (
                    <button onClick={() => runBackgroundCheck(activeApplication.id)} style={{
                      background: "none", border: "1px solid var(--gold)", color: "var(--gold)",
                      borderRadius: 999, padding: "4px 10px", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 11.5, cursor: "pointer",
                    }}>Run check</button>
                  )}
                </div>

                {activeApplication.status === "pending" ? (
                  <div style={{ display: "flex", gap: 10 }}>
                    <button className="primary-btn"
                      style={{ background: "var(--danger)", opacity: 1 }}
                      onClick={() => { decideApplication(activeApplication.id, "rejected"); back(); }}>
                      <XCircle size={15} /> Reject
                    </button>
                    <button className="primary-btn"
                      disabled={activeApplication.bgCheck !== "clear" || !activeApplication.resumeVerified || !activeApplication.zoomConnected}
                      style={{ opacity: (activeApplication.bgCheck !== "clear" || !activeApplication.resumeVerified || !activeApplication.zoomConnected) ? 0.45 : 1 }}
                      onClick={() => { decideApplication(activeApplication.id, "approved"); back(); }}>
                      <CheckCircle2 size={15} /> Approve
                    </button>
                  </div>
                ) : (
                  <div style={{
                    fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, textAlign: "center", padding: 10,
                    borderRadius: 8, background: "var(--paper-outer)", color: "var(--ink)",
                  }}>
                    This application has been {activeApplication.status}.
                  </div>
                )}
              </div>
            </>
          )}

        </div>

      </div>
  );
}


const root = createRoot(document.getElementById("root"));
root.render(<MentorshipApp />);
</script>
</body>
</html>
